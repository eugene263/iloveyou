<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec7">
<title>Наскільки ти знаєш нас? 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-50:#fff0f6; --pink-100:#ffdeeb; --pink-200:#ffc2d9; --pink-300:#ff9ec7;
    --pink-400:#ff74ad; --pink-500:#f0509a; --pink-700:#a82d66; --ink:#5b2342;
    --ok:#3ecf8e; --bad:#ff6b81; --card:#ffffffd9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffe3ef 0%,#ffc2d9 50%,#ffd6e8 100%) fixed;
    min-height:100dvh; overflow-x:hidden;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:.7}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 0 40px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .card{
    background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:26px 22px;
    box-shadow:0 10px 0 var(--pink-300),0 20px 40px #f0509a40;border:3px solid #fff;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:2.1rem;line-height:1.25;margin:0 0 10px;color:var(--pink-500);text-align:center}
  h2{font-size:1.35rem;line-height:1.3;margin:0 0 18px;text-align:center}
  p{line-height:1.5;margin:0 0 14px}
  .center{text-align:center}
  .big-emoji{font-size:4.2rem;text-align:center;animation:bob 2s ease-in-out infinite;display:block;margin-bottom:6px}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}

  input[type=text]{
    width:100%;font:inherit;font-size:1.1rem;padding:14px 18px;border-radius:18px;
    border:3px solid var(--pink-200);background:#fff;color:var(--ink);outline:none;text-align:center;margin-bottom:14px;
  }
  input[type=text]:focus{border-color:var(--pink-400)}

  .btn{
    display:block;width:100%;font:inherit;font-weight:600;font-size:1.1rem;color:#fff;
    background:linear-gradient(180deg,var(--pink-400),var(--pink-500));border:0;border-radius:20px;
    padding:15px 18px;cursor:pointer;box-shadow:0 6px 0 var(--pink-700);transition:transform .1s,box-shadow .1s;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-700)}
  .btn.ghost{background:#fff;color:var(--pink-500);box-shadow:0 6px 0 var(--pink-200);margin-top:14px}
  .btn.ghost:active{box-shadow:0 1px 0 var(--pink-200)}

  /* HUD */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:14px;font-weight:600}
  .pill{background:#fff;border-radius:99px;padding:5px 10px;box-shadow:0 3px 0 var(--pink-200);font-size:.82rem;white-space:nowrap}
  .bar{height:14px;background:#fff;border-radius:99px;overflow:hidden;margin-bottom:18px;box-shadow:inset 0 2px 4px #f0509a30}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));border-radius:99px;transition:width .5s cubic-bezier(.2,1.2,.4,1)}

  .opt{
    display:block;width:100%;text-align:left;font:inherit;font-size:1.05rem;color:var(--ink);
    background:#fff;border:3px solid var(--pink-200);border-radius:18px;padding:13px 16px;margin-bottom:11px;
    cursor:pointer;box-shadow:0 4px 0 var(--pink-200);transition:transform .1s,background .2s,border-color .2s;
  }
  .opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--pink-200)}
  .opt.correct{background:#d9fbe9;border-color:var(--ok);box-shadow:0 4px 0 #2aa972;animation:jump .5s}
  .opt.wrong{background:#ffe0e5;border-color:var(--bad);box-shadow:0 4px 0 #d6455d;animation:shake .45s}
  .opt.gone{opacity:.25;text-decoration:line-through}
  .opt:disabled{cursor:default}
  @keyframes jump{40%{transform:scale(1.05)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  .hint{background:none;border:0;font:inherit;color:var(--pink-500);font-weight:600;cursor:pointer;display:block;margin:6px auto 0;padding:6px}
  .hint:disabled{opacity:.4;cursor:default}

  .feedback{margin-top:8px;padding:14px;border-radius:18px;text-align:center;font-weight:500;animation:pop .35s}
  .feedback.ok{background:#d9fbe9}
  .feedback.no{background:#ffe0e5}

  /* runaway */
  .arena{position:relative;height:180px;margin-bottom:10px}
  .arena .btn{position:absolute;width:auto;padding:14px 28px}
  #yes{left:8%;top:30px;transition:transform .2s}
  #no{right:8%;top:30px;background:linear-gradient(180deg,#b5b5c3,#8e8ea0);box-shadow:0 6px 0 #6b6b7b;transition:left .15s,top .15s}

  /* result */
  .score{font-size:3.4rem;font-weight:700;color:var(--pink-500);text-align:center;line-height:1}
  .rank{font-family:'Pacifico',cursive;font-size:1.6rem;text-align:center;margin:8px 0 14px;color:var(--pink-700)}
  .recap{margin:16px 0 0;padding:0;list-style:none;font-size:.95rem}
  .recap li{display:flex;gap:8px;padding:7px 0;border-bottom:2px dashed var(--pink-200)}
  .recap li:last-child{border:0}
  .recap b{font-weight:600}

  .conf{position:fixed;top:-20px;z-index:10;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
  /* mini-games */
  .game-box{position:relative;background:#fff;border:3px dashed var(--pink-300);border-radius:22px;padding:14px;margin-bottom:14px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .meter{height:22px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin:10px 0}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb86b,var(--pink-500));transition:width .1s}
  .cat{font-size:5rem;line-height:1.1;transition:transform .1s}
  .cat.bump{transform:scale(1.18) rotate(-5deg)}
  .timer{font-weight:700;font-size:1.3rem;color:var(--pink-500)}
  .sky{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(#fff6fa,#ffe3ef)}
  .drop{position:absolute;top:-50px;font-size:2.4rem;cursor:pointer;border:0;background:none;padding:6px;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(360px)}}
  .track{position:relative;height:46px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin:18px 0}
  .zone{position:absolute;top:0;bottom:0;background:#9af0c4;border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
  .marker{position:absolute;top:2px;font-size:2.4rem;line-height:1;transform:translateX(-50%)}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .mc{aspect-ratio:1;font-size:2rem;border:3px solid var(--pink-200);border-radius:16px;background:var(--pink-300);color:transparent;cursor:pointer;box-shadow:0 4px 0 var(--pink-400);transition:transform .25s;font:inherit;font-size:2rem}
  .mc.up{background:#fff;color:inherit;transform:rotateY(0)}
  .mc.done{background:#d9fbe9;border-color:var(--ok);box-shadow:none}
  .kbd{display:inline-block;background:var(--pink-100);border-radius:8px;padding:2px 10px;font-weight:600;box-shadow:0 3px 0 var(--pink-200)}

  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;background:#fff;border:3px solid var(--pink-400);border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--pink-300);text-align:center;animation:toast 3.2s forwards;max-width:90vw}
  .toast small{display:block;font-size:.8rem;opacity:.8}
  @keyframes toast{0%{transform:translate(-50%,-90px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-120px)}}
  .qphoto{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:20px;border:4px solid #fff;box-shadow:0 6px 0 var(--pink-200);margin:0 auto 14px}
  .achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .ach{background:var(--pink-100);border-radius:14px;padding:8px 4px;opacity:.55;font-size:1.6rem;text-align:center}
  .ach.on{background:#fff;opacity:1;box-shadow:0 3px 0 var(--pink-300)}
  .ach small{display:block;font-size:.7rem;line-height:1.1;margin-top:2px}
  .ticket{border:4px dashed var(--pink-400);border-radius:22px;background:#fff;padding:18px;margin-bottom:6px}
  .ticket p{margin:0 0 8px}

  .srow{background:#fff;border:3px solid var(--pink-200);border-radius:18px;padding:12px 14px;margin-bottom:12px}
  .shead{display:flex;justify-content:space-between;font-size:1.1rem;margin-bottom:8px;font-weight:500}
  .sval{color:var(--pink-500);min-width:3.2ch;text-align:right}
  .strack{position:relative;height:12px;margin:12px 0 18px}
  .szone{position:absolute;z-index:2;top:-2px;height:16px;background:#3ecf8e66;border-radius:99px;border:2px solid var(--ok);pointer-events:none;animation:pop .4s}
  .sres{margin-top:6px;font-size:.9rem;font-weight:500;text-align:center}
  .sres.ok{color:#1f9d63}.sres.no{color:#d6455d}
  input[type=range]{-webkit-appearance:none;appearance:none;position:relative;z-index:1;width:100%;height:12px;background:transparent;margin:0;display:block;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--pink-100)}
  input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--pink-100)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-9px;border-radius:50%;background:var(--pink-500);border:4px solid #fff;box-shadow:0 3px 0 var(--pink-700)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--pink-500);border:4px solid #fff;box-shadow:0 3px 0 var(--pink-700)}
  input[type=range]:disabled{opacity:.9}
  .oitem{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--pink-200);border-radius:16px;padding:8px 10px;margin-bottom:9px}
  .oitem.ok{background:#d9fbe9;border-color:var(--ok)}.oitem.no{background:#ffe0e5;border-color:var(--bad)}
  .onum{width:28px;height:28px;border-radius:50%;background:var(--pink-300);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
  .otxt{flex:1;text-align:left}
  .ob{border:0;background:var(--pink-100);color:var(--pink-500);border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer}.ob:disabled{opacity:.3}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
  .who{font:inherit;font-size:1.2rem;font-weight:600;padding:22px 8px;border:3px solid var(--pink-200);border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--pink-200);cursor:pointer}
  .who.correct{background:#d9fbe9;border-color:var(--ok)}
  .sstage{position:relative;height:150px;margin:8px 0 14px}
  .scard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:#fff;border:3px solid var(--pink-300);border-radius:22px;box-shadow:0 6px 0 var(--pink-200);font-size:1.15rem;touch-action:pan-y;cursor:grab;transition:transform .25s,opacity .25s}
  .scard.fly-r{transform:translateX(130%) rotate(18deg)!important;opacity:0}.scard.fly-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
  .scard.cok{border-color:var(--ok)}.scard.cno{border-color:var(--bad)}
  .fill{font-size:1.15rem;line-height:2.3;text-align:center}
  select{font:inherit;font-size:1rem;padding:6px 8px;border-radius:12px;border:3px solid var(--pink-200);background:#fff;color:var(--ink);max-width:100%}
  select.ok{border-color:var(--ok);background:#d9fbe9}select.no{border-color:var(--bad);background:#ffe0e5}
  .map{position:relative;height:250px;border-radius:20px;border:4px solid #fff;box-shadow:0 5px 0 var(--pink-200);overflow:hidden;cursor:crosshair;margin-bottom:12px;
    background:linear-gradient(90deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(0deg,transparent 40%,#fff 40% 47%,transparent 47%),linear-gradient(#ffe9f2,#ffd6e8);}
  .map.img{background-size:cover;background-position:center}
  .lm{position:absolute;transform:translate(-50%,-50%);font-size:1.6rem;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);font-size:2rem;pointer-events:none;animation:jump .4s}
  .tzone{position:absolute;transform:translate(-50%,-50%);border:3px dashed var(--ok);background:#3ecf8e44;border-radius:50%;pointer-events:none}
  .pcv{width:100%;max-width:300px;display:block;margin:0 auto 14px;border-radius:20px;border:4px solid #fff;box-shadow:0 5px 0 var(--pink-200);background:#fff}
  .wheelbox{position:relative;width:280px;height:300px;margin:0 auto 14px}
  .wheel{position:absolute;top:20px;left:0;width:280px;height:280px;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 var(--pink-300);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
  .wl{position:absolute;left:50%;top:50%;font-size:.62rem;font-weight:600;white-space:nowrap;color:var(--ink);width:96px;margin-left:-48px;margin-top:-8px;text-align:center;white-space:normal;line-height:1.05}
  .wptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:2;color:var(--pink-700)}
  .ticketbox{position:relative;margin-bottom:6px}
  .scratch{position:absolute;inset:0;border-radius:22px;touch-action:none;transition:opacity .6s;cursor:grab}.scratch.gone{opacity:0}

  .xp{margin-bottom:18px;cursor:pointer}
  .xtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .xtop small{opacity:.8;font-size:.78rem;text-align:right}
  .xtrack{position:relative;height:16px;background:#fff;border-radius:99px;margin:0 14px;box-shadow:inset 0 2px 4px #f0509a30}
  .xtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));transition:width .9s cubic-bezier(.2,1.1,.4,1)}
  .xm{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1rem;background:#fff;border:2px solid var(--pink-200);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;filter:grayscale(.6);z-index:1}
  .xm.on{filter:none;border-color:var(--pink-500);animation:jump .5s}
  .toast.big{background:linear-gradient(#fff,#ffe3ef);border-color:var(--pink-500);font-size:1.1rem;cursor:pointer}
  .ov{position:fixed;inset:0;background:#5b234266;z-index:30;display:grid;place-items:center;padding:16px;animation:pop .25s}
  .modal{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:440px;max-height:88dvh;overflow:auto;border:4px solid var(--pink-300)}
  .lvls{list-style:none;margin:0 0 14px;padding:0}
  .lvls li{display:flex;gap:12px;align-items:center;padding:9px 6px;border-bottom:2px dashed var(--pink-200);opacity:.55}
  .lvls li.on{opacity:1}
  .lvls .li{font-size:1.8rem;width:42px;text-align:center}
  .lvls .lt{font-size:.95rem;line-height:1.3}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main id="app"></main>

<script>
/* =====================================================================
   ✏️  ТУТ РЕДАГУЄМО ПИТАННЯ  ✏️
   - q      : текст питання
   - emoji  : емоджі до питання
   - options: варіанти. ПЕРШИЙ ВАРІАНТ = ПРАВИЛЬНА ВІДПОВІДЬ
              (на сайті вони перемішуються автоматично)
   - ok     : що написати, якщо вгадала
   - no     : що написати, якщо помилилась
   Зараз правильні відповіді — заглушки, їх треба замінити на справжні!
   ===================================================================== */
const HER_NAME_FALLBACK = "красуня";

const QUESTIONS = [
  { emoji:"👀", q:"Де ми вперше з'явились в житті одне одного?",
    options:["[Справжнє місце знайомства]","У ліфті, де ти мовчав(ла) 12 поверхів","На зустрічі анонімних любителів піци","В очереді за шаурмою"],
    ok:"Це ж початок нашої історії! 🥹", no:"Ну як так, це ж найперший рівень гри! 🙈" },

  { emoji:"💬", q:"Хто першим написав повідомлення?",
    options:["Я","Ти","Ми одночасно (телепатія!)","Мамин кіт з телефону"],
    ok:"Так, так! Сміливість міст бере 😎", no:"Ай-яй, треба було краще пам'ятати 😅" },

  { emoji:"☕", q:"Куди ми пішли на перше побачення?",
    options:["[Справжнє місце побачення]","На парковку, дивитись на машини","У музей старих утюгів","На ринок за картоплею"],
    ok:"Романтика на максималках ✨", no:"Побачення було цілком нормальне, чесно! 😂" },

  { emoji:"💋", q:"Де ми вперше поцілувались?",
    options:["[Справжнє місце першого поцілунку]","У поліції (довга історія)","На стоянці біля магазину","Під час розбору фільму про динозаврів"],
    ok:"Ти це пам'ятаєш!! Я розтанув(ла) 🫠", no:"Серйозно?! Такий момент — і не пам'ятаєш? 😤💕" },

  { type:"map", emoji:"📍", q:"Тапни на схемі, де ми вперше поцілувались",
    /* target — правильна точка у % (x,y), radius — допустима похибка. image:"photos/map.jpg" — своя карта */
    target:{x:62,y:42}, radius:12, answerText:"[місце першого поцілунку]",
    ok:"Точно в яблучко! 💘", no:"Мапа — не твоє, але я пробачаю 😘" },

  { emoji:"🍕", q:"Що ми замовили на нашому першому спільному вечері?",
    options:["[Що саме їли]","Тарілку тиші","Суші, але без суші","Борщ з ананасами"],
    ok:"Гурман-детектив! 🕵️‍♀️", no:"Мізки на каві, видно 🥲" },

  /* 🎚️ ПИТАННЯ З ПОВЗУНКАМИ: items[].answer — правильний відсоток (0-100).
     Похибка TOLERANCE (за замовч. 10) в обидва боки. Заміни answer на справжні! */
  { type:"slider", emoji:"🍕", q:"Наскільки сильно я люблю…? (влучи в % з похибкою ±10)",
    tolerance:10,
    items:[
      { emoji:"🍕", label:"Піцу",      answer:90 },
      { emoji:"🫐", label:"Чорнослив", answer:35 },
      { emoji:"🥔", label:"Пюрешку",   answer:75 }
    ],
    ok:"Ти знаєш мій смак краще за мене 🍽️", no:"Ну, гастрономічні вподобання — штука тонка 😅" },

  { type:"order", emoji:"📅", q:"Розклади події нашої історії по порядку",
    items:["👋 Познайомились","☕ Перше побачення","💋 Перший поцілунок","💞 Стали парою","✈️ Перша спільна подорож"],   // у ПРАВИЛЬНОМУ порядку
    ok:"Хронологія — ідеальна! 🕰️", no:"Хтось плутає дати 😅" },

  { type:"swipe", emoji:"🤔", q:"Правда чи міф? Свайпай!",
    cards:[
      { t:"Я ніколи не їв суші", a:false },
      { t:"Моя улюблена пора року — літо", a:true },
      { t:"Я вмію готувати борщ", a:true },
      { t:"Я ніколи не запізнювався на побачення", a:false },
      { t:"Я боюсь павуків", a:true }
    ],
    ok:"Ти мене читаєш як відкриту книгу 📖", no:"Є ще таємниці, цікаво? 😏" },

  { emoji:"📱", q:"Як я записаний(а) у твоєму телефоні?",

const POINTS = 100, STREAK_BONUS = 25;

/* helpers */
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if(v==null||v===false) continue;
    if (k==='class') n.className=v; else if (k==='text') n.textContent=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k,v);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
};
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = a => a[Math.random()*a.length|0];
function checkLevels(){
  LEVELS.forEach((L,i)=>{
    if(state._s>=L.at && !state.lvl.has(i)){
      state.lvl.add(i);
      const n=el('div',{class:'toast big',onclick:()=>n.remove()},el('b',{text:`${L.icon} Рівень ${i+1} відкрито!`}),el('small',{text:`Приз: ${L.reward}`}));
      document.body.append(n); setTimeout(()=>n.remove(),4200); confetti(50); vibrate([30,20,30,20,60]);
    }
  });
}
function openRewards(){
  const ov=el('div',{class:'ov',onclick:e=>{if(e.target===ov)ov.remove();}},
    el('div',{class:'modal'},
      el('h2',{text:'🎁 Призи за бали'}),
      el('ul',{class:'lvls'},LEVELS.map((L,i)=>el('li',{class:state.lvl.has(i)?'on':''},
        el('span',{class:'li',text:state.lvl.has(i)?L.icon:'🔒'}),
        el('span',{class:'lt'},el('b',{text:`Рівень ${i+1} • ${L.at} ⭐`}),el('br'),state.lvl.has(i)?L.reward:'Ще закрито'))) ),
      el('button',{class:'btn',text:'Закрити',onclick:()=>ov.remove()})));
  document.body.append(ov);
}
function xpBar(){
  const next=LEVELS.find((L,i)=>!state.lvl.has(i));
  const fill=el('i'); fill.style.width=(Math.min(state.shown,MAX_SCORE)/MAX_SCORE*100)+'%';
  const track=el('div',{class:'xtrack'},fill,...LEVELS.map((L,i)=>{const m=el('span',{class:'xm'+(state.lvl.has(i)?' on':''),text:state.lvl.has(i)?L.icon:'🎁'}); m.style.left=(L.at/MAX_SCORE*100)+'%'; return m;}));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width=(Math.min(state._s,MAX_SCORE)/MAX_SCORE*100)+'%'; state.shown=state._s;}));
  return el('div',{class:'xp',onclick:openRewards,title:'Натисни, щоб побачити призи'},
    el('div',{class:'xtop'},el('b',{text:`⭐ ${state._s} / ${MAX_SCORE}`}),
      el('small',{text: next ? `до призу ${next.icon}: ще ${next.at-state._s}` : '🏆 Усі призи відкрито!'})),
    track);
}
function award(id){
  if(state.ach.has(id)) return; state.ach.add(id);
  const [e,t,d]=ACH[id];
  const n=el('div',{class:'toast'},el('b',{text:`${e} Ачівка: ${t}`}),el('small',{text:d}));
  document.body.append(n); setTimeout(()=>n.remove(),3200);
}
const total = () => QUESTIONS.length + 1;
function render(...nodes){ $app.replaceChildren(...nodes); window.scrollTo({top:0}); }
const vibrate = ms => { try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){} };

/* confetti */
function confetti(n=70){
  const set=['💖','🌸','✨','🎀','💕','🩷','⭐'];
  for(let i=0;i<n;i++){
    const c=el('span',{class:'conf',text:pick(set)});
    c.style.left=Math.random()*100+'vw';
    c.style.fontSize=(16+Math.random()*20)+'px';
    c.style.animationDuration=(2+Math.random()*2.5)+'s';
    c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.append(c); setTimeout(()=>c.remove(),5500);
  }
}

function sliderScreen(Q){
  state.answered = false;
  const tol = Q.tolerance ?? 10, PER = 40;
  const rows = Q.items.map(it => {
    const out = el('b',{class:'sval',text:'50%'});
    const inp = el('input',{type:'range',min:'0',max:'100',value:'50',step:'1'});
    inp.addEventListener('input',()=>{ out.textContent=inp.value+'%'; });
    const res = el('div',{class:'sres'});
    const track = el('div',{class:'strack'},inp);
    return { it, inp, res, node: el('div',{class:'srow'},
      el('div',{class:'shead'},el('span',{text:`${it.emoji} ${it.label}`}),out), track, res) };
  });
  const fb = el('div');
  const check = el('button',{class:'btn',text:'Перевірити ✅'});
  check.addEventListener('click',()=>{
    if(state.answered) return; state.answered = true; check.remove();
    let hits = 0;
    rows.forEach(r => {
      const v = +r.inp.value, a = r.it.answer, ok = Math.abs(v-a) <= tol;
      r.inp.disabled = true; if(ok) hits++;
      const zone = el('i',{class:'szone'}); zone.style.left = Math.max(0,a-tol)+'%'; zone.style.width = (Math.min(100,a+tol)-Math.max(0,a-tol))+'%';
      r.node.querySelector('.strack').prepend(zone);
      r.res.className = 'sres '+(ok?'ok':'no');
      r.res.textContent = ok ? `✅ Влучила! Правильно ${a}%` : `❌ Ти: ${v}%, правильно: ${a}%`;
    });
    const isRight = hits === rows.length;
    const gain = hits*PER + (isRight ? POINTS-hits*PER+ (state.streak>0?STREAK_BONUS*state.streak:0) : 0);
    state.score += gain;
    if(isRight){ state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak); confetti(30); vibrate(30); if(state.streak>=5) award('fire'); award('slider'); }
    else { state.streak = 0; if(hits===0){ state.lives--; } vibrate([60,40,60]); }
    state.log.push({q:Q.q,right:isRight,answer:Q.items.map(x=>`${x.label} ${x.answer}%`).join(', ')});
    fb.replaceChildren(
      el('div',{class:'feedback '+(isRight?'ok':'no'),text:`${hits}/${rows.length} влучань, +${gain} очок. `+(isRight?Q.ok:Q.no)}),
      el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : state.i===QUESTIONS.length-1?'До фінального боса 👑':'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion}));
  });
  render(el('div',{class:'card'}, ...hud(),
    el('span',{class:'big-emoji',text:Q.emoji}),
    el('h2',{text:Q.q}),
    el('p',{class:'center',style:'font-size:.9rem',text:'Посунь повзунки туди, де, на твою думку, мій відсоток любові 👇'}),
    ...rows.map(r=>r.node), check, fb));
}

function questionScreen(){
  if(state.i >= QUESTIONS.length) return bossScreen();
  const Q = QUESTIONS[state.i];
  if(Q.type&&TYPES[Q.type]) return TYPES[Q.type](Q);
  state.answered = false;
  const correct = Q.options[0];
  const opts = shuffle(Q.options);
  const btns = opts.map(o => {
    const b = el('button',{class:'opt',text:o});
    b.addEventListener('click',()=>answer(b,o===correct));
    return b;
  });
  const fb = el('div');
  const hintBtn = el('button',{class:'hint',text:`💡 Підказка (${state.hints})`});
  if(!state.hints) hintBtn.disabled = true;
  hintBtn.addEventListener('click',()=>{
    if(state.answered||!state.hints) return;
    state.hints--;
    shuffle(btns.filter(b=>b.textContent!==correct)).slice(0,2).forEach(b=>{b.classList.add('gone');b.disabled=true;});
    hintBtn.textContent=`💡 Підказка (${state.hints})`; hintBtn.disabled=true;
  });

  function answer(btn, isRight){
    if(state.answered) return; state.answered = true;
    btns.forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add('correct'); });
    hintBtn.disabled = true;
    let gain = 0;
    if(isRight){
      state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak);
      gain = POINTS + (state.streak>1 ? STREAK_BONUS*(state.streak-1) : 0);
      state.score += gain; confetti(24); vibrate(30); if(state.streak>=5) award('fire');
    } else {
      btn.classList.add('wrong'); state.streak = 0; state.lives--; vibrate([60,40,60]);
    }
    state.log.push({q:Q.q,right:isRight,answer:correct});
    fb.replaceChildren(
      el('div',{class:'feedback '+(isRight?'ok':'no'),text:(isRight?`+${gain} очок! `:'Мимо! ')+(isRight?Q.ok:Q.no)}),
      el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : state.i===QUESTIONS.length-1?'До фінального боса 👑':'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion})
    );
  }

  render(el('div',{class:'card'}, ...hud(),
    Q.photo ? el('img',{class:'qphoto',src:Q.photo,alt:''}) : el('span',{class:'big-emoji',text:Q.emoji}),
    el('h2',{text:Q.q}), ...btns, hintBtn, fb));
}

function bossScreen(){
  const arena = el('div',{class:'arena'});
  const yes = el('button',{class:'btn',id:'yes',text:'Так 💖'});
  const no  = el('button',{class:'btn',id:'no',text:'Ні'});
  let dodges = 0, scale = 1;
  const noTexts = ['Ні','Ти впевнена?','Подумай ще!','Точно ні?','Не тисни!','Ну будь ласка 🥺','Я ж плакати буду','Ок, ні… 😭'];
  const flee = e => {
    if(e) e.preventDefault();
    dodges++; state.dodges=dodges; if(dodges>=8) award('boss'); scale = Math.min(scale+0.18, 2.2);
    yes.style.transform = `scale(${scale})`;
    no.textContent = noTexts[Math.min(dodges, noTexts.length-1)];
    const w = arena.clientWidth - no.offsetWidth, h = arena.clientHeight - no.offsetHeight;
    no.style.right = 'auto';
    no.style.left = Math.random()*w+'px';
    no.style.top  = Math.random()*h+'px';
    vibrate(15);
  };
  no.addEventListener('mouseenter',flee);
  no.addEventListener('touchstart',flee,{passive:false});
  no.addEventListener('click',flee);
  yes.addEventListener('click',()=>{
    state.score += 500; state.streak++; state.log.push({q:BOSS.q,right:true,answer:'Так 💖'});
    state.i++; confetti(120); vibrate([40,30,40,30,80]); resultScreen();
  });
  arena.append(yes,no);
  render(el('div',{class:'card'}, ...hud(),
    el('span',{class:'big-emoji',text:BOSS.emoji}),
    el('h2',{text:BOSS.q}),
    arena,
    el('p',{class:'center',text:'(Кнопка «Ні» трохи сором\'язлива, не лови її 😇)'})));
}

/* =====================================================================

const GAMES = [

let cleanups = [];
const onCleanup = f => cleanups.push(f);
function stopGame(){ cleanups.forEach(f=>{try{f()}catch(e){}}); cleanups = []; }

function afterQuestion(){ stopGame(); proceed(); }
function proceed(){
  const g = GAMES.find(g=>g.after===state.i+1);
  if(g) return gameIntro(g.run);

/* shell: intro -> play -> result */
function gameIntro(run, revive){
  run.intro(() => {
    const done = (pts, msg) => {
      stopGame();
      if(revive){
        if(pts>=60){ state.lives=1; award('survivor'); confetti(60);
          return render(el('div',{class:'card center'},el('span',{class:'big-emoji',text:'❤️‍🩹'}),el('h2',{text:'Ти повернулась! +1 ❤️'}),el('p',{text:msg}),

        return render(el('div',{class:'card center'},el('span',{class:'big-emoji',text:'😿'}),el('h2',{text:'Котик ще голодний…'}),el('p',{text:msg}),
          el('button',{class:'btn',text:'Ще раз! 🔁',onclick:()=>gameIntro(gameCat,true)})));
      }
      state.score += pts; if(pts>=100) confetti(40); vibrate(40);
      render(el('div',{class:'card center'},
        el('span',{class:'big-emoji',text:pts>=100?'🎉':'👍'}),

        el('p',{text:msg}),
        el('button',{class:'btn',text:'Далі до питань ➡️',onclick:()=>{ stopGame(); state.i++; questionScreen(); }})));

/* 3) Ідеальний поцілунок — зупини рухомий маркер у зеленій зоні */
function gameKiss(done){
  let hits=0, tries=0; const MAX=3; let over=false;
  const track=el('div',{class:'track'}), zone=el('div',{class:'zone'}), mk=el('div',{class:'marker',text:'💋'});
  const info=el('p',{class:'timer',text:`Спроба 1/${MAX}`});
  track.append(zone,mk);
  let pos=0, dir=1, speed=1.1; let raf, last=performance.now();
  const newZone=()=>{ const w=Math.max(12,22-tries*3), l=10+Math.random()*(80-w); zone.style.left=l+'%'; zone.style.width=w+'%'; zone._l=l; zone._w=w; };
  newZone();
  const loop=now=>{
    const dt=now-last; last=now;
    pos+=dir*speed*dt/16; if(pos>=100){pos=100;dir=-1} if(pos<=0){pos=0;dir=1}
    mk.style.left=pos+'%'; raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop); onCleanup(()=>cancelAnimationFrame(raf));
  const stop=()=>{
    if(over) return; tries++;
    const ok = pos>=zone._l && pos<=zone._l+zone._w;
    if(ok){hits++; vibrate(30);} else vibrate([40,30,40]);
    info.textContent = ok?'💥 ЧМОК!':'🙈 Мимо!';
    if(tries>=MAX){ over=true; cancelAnimationFrame(raf);
      if(hits===3) award('sniper');
      setTimeout(()=>done(hits*50, hits===3?'Ідеальні три поцілунки з трьох! Профі 😘😘😘':hits?`Влучила ${hits} з ${MAX}. Є над чим тренуватись разом 😏`:'Жодного... доведеться тренуватись в реальному житті 💋'),700);
    } else setTimeout(()=>{ speed+=.5; newZone(); info.textContent=`Спроба ${tries+1}/${MAX}`; },600);
  };
  const key=e=>{ if(e.code==='Space'){e.preventDefault(); if(!e.repeat) stop();} };
  document.addEventListener('keydown',key); onCleanup(()=>document.removeEventListener('keydown',key));
  playCard('Ідеальний поцілунок',
    el('p',{},'Натисни ',el('span',{class:'kbd',text:'ПРОБІЛ'}),' (або кнопку), коли 💋 у зеленій зоні!'),
    el('div',{class:'game-box'},info,track),
    el('button',{class:'btn',text:'💋 ЧМОК!',onclick:stop}));
}

function gameMemory(done){
  const faces=shuffle(['🐱','🍕','🌹','💍','🎀','🧸']); const pairs=faces.slice(0,6);
  const deck=shuffle([...pairs,...pairs]);

        } else setTimeout(()=>{ [a,b].forEach(x=>{x.classList.remove('up');x.textContent='❔'}); open=[]; lock=false; },700);

gameMemory.intro = go => introCard('🃏','Знайди пари!','12 карточок, 6 пар. Тренуємо пам\'ять — вона знадобиться для питань про нас 😉',go);

/* =====================================================================
   🧩 НОВІ ФОРМАТИ ПИТАНЬ (type у QUESTIONS):
   order  — розклади по порядку   | swipe — правда/міф зі свайпом
   text   — ввести відповідь      | who   — «Хто з нас?»
   fill   — заповни пропуски      | map   — тапни на карті
   pixel  — піксельне фото
   ===================================================================== */
function shell(Q, ...kids){
  render(el('div',{class:'card'}, ...hud(),
    Q.photo ? el('img',{class:'qphoto',src:Q.photo,alt:''}) : el('span',{class:'big-emoji',text:Q.emoji}),
    el('h2',{text:Q.q}), ...kids));
}
/* спільне підбиття підсумку: ratio 0..1 */
function resolve(Q, ratio, fb, o={}){
  state.answered = true;
  const right = ratio >= .999;
  const gain = o.gain ?? (right ? POINTS + (state.streak>0 ? STREAK_BONUS*state.streak : 0) : Math.round(POINTS*ratio*.5));
  state.score += gain;
  if(right){ state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak); confetti(30); vibrate(30); if(state.streak>=5) award('fire'); }
  else { state.streak = 0; if(ratio===0) state.lives--; vibrate([60,40,60]); }
  state.log.push({q:Q.q,right,answer:o.answer||''});
  fb.replaceChildren(
    el('div',{class:'feedback '+(right?'ok':'no'),text:`${o.detail?o.detail+' • ':''}+${gain} очок. `+(right?Q.ok:Q.no)}),
    el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : state.i===QUESTIONS.length-1?'До фінального боса 👑':'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion}));
}
const norm = s => String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function lev(a,b){ const d=Array.from({length:a.length+1},(_, i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }

/* --- 📅 розклади по порядку: Q.items у ПРАВИЛЬНОМУ порядку --- */
function orderScreen(Q){
  state.answered=false;
  let list = shuffle(Q.items);
  if(list.join()===Q.items.join()) list.reverse();
  const box = el('div'), fb = el('div'), check = el('button',{class:'btn',text:'Перевірити ✅'});
  const draw = () => box.replaceChildren(...list.map((t,i)=>el('div',{class:'oitem'},
    el('span',{class:'onum',text:i+1}), el('span',{class:'otxt',text:t}),
    el('button',{class:'ob',text:'▲','aria-label':'вгору',disabled:state.answered||i===0?'':null,onclick:()=>mv(i,-1)}),
    el('button',{class:'ob',text:'▼','aria-label':'вниз',disabled:state.answered||i===list.length-1?'':null,onclick:()=>mv(i,1)}))));
  const mv=(i,d)=>{ if(state.answered) return; [list[i],list[i+d]]=[list[i+d],list[i]]; draw(); vibrate(8); };
  draw();
  check.addEventListener('click',()=>{
    if(state.answered) return; check.remove();
    const hits=list.filter((t,i)=>t===Q.items[i]).length;
    state.answered=true; draw();
    [...box.children].forEach((r,i)=>r.classList.add(list[i]===Q.items[i]?'ok':'no'));
    resolve(Q,hits/list.length,fb,{answer:Q.items.join(' → '),detail:`На місці: ${hits}/${list.length}. Правильно: ${Q.items.join(' → ')}`});
  });
  shell(Q, el('p',{class:'center',style:'font-size:.9rem',text:'Стрілками ▲▼ розстав події від найпершої до найпізнішої'}), box, check, fb);
}

/* --- 👉👈 правда/міф: Q.cards = [{t:"…", a:true|false}] --- */
function swipeScreen(Q){
  state.answered=false; let k=0, good=0;
  const stage=el('div',{class:'sstage'}), cnt=el('p',{class:'center timer'}), fb=el('div');
  const btns=el('div',{class:'row2'},
    el('button',{class:'btn ghost',style:'margin:0',text:'❌ Міф',onclick:()=>decide(false)}),
    el('button',{class:'btn',text:'✅ Правда',onclick:()=>decide(true)}));
  let card;
  const show=()=>{
    if(k>=Q.cards.length){ btns.remove(); cnt.textContent='';
      stage.replaceChildren(el('div',{class:'scard',style:'position:static;transform:none'},`Відгадано ${good} з ${Q.cards.length}`));
      return resolve(Q,good/Q.cards.length,fb,{answer:Q.cards.map(c=>`${c.t} — ${c.a?'правда':'міф'}`).join('; '),detail:`${good}/${Q.cards.length}`}); }
    cnt.textContent=`Картка ${k+1}/${Q.cards.length}`;
    card=el('div',{class:'scard',text:Q.cards[k].t}); stage.replaceChildren(card);
    let x0=null,dx=0;
    card.addEventListener('pointerdown',e=>{x0=e.clientX;card.setPointerCapture(e.pointerId);});
    card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;});
    card.addEventListener('pointerup',()=>{ if(x0===null)return; x0=null; if(Math.abs(dx)>80) decide(dx>0); else {card.style.transform='';} dx=0; });
  };
  const decide=v=>{
    if(state.answered||k>=Q.cards.length) return;
    const ok=Q.cards[k].a===v; if(ok) good++; vibrate(ok?15:[30,20,30]);
    card.classList.add(v?'fly-r':'fly-l',ok?'cok':'cno'); k++; setTimeout(show,260);
  };
  shell(Q, el('p',{class:'center',style:'font-size:.9rem',text:'Свайпай картку праворуч (правда) або ліворуч (міф), або тисни кнопки'}), cnt, stage, btns, fb);
  show();
}

/* --- ⌨️ ввести відповідь: Q.accept = ["варіант1","варіант2"] --- */
function textScreen(Q){
  state.answered=false;
  const inp=el('input',{type:'text',placeholder:Q.placeholder||'Твоя відповідь…',autocomplete:'off'}), fb=el('div');
  const btn=el('button',{class:'btn',text:'Відповісти ✅'});
  const go=()=>{
    if(state.answered||!inp.value.trim()) return; btn.remove(); inp.disabled=true;
    const v=norm(inp.value);
    const ok=Q.accept.some(a=>{const n=norm(a); return v===n || (n.length>4 && lev(v,n)<=1);});
    resolve(Q, ok?1:0, fb, {answer:Q.accept[0],detail:ok?'':`Правильно: ${Q.accept[0]}`});
  };
  btn.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  shell(Q, inp, btn, fb);
}

/* --- 🙋 хто з нас: Q.answer = "me" | "you" --- */
function whoScreen(Q){
  state.answered=false; const fb=el('div');
  const mk=(id,label)=>el('button',{class:'who',text:label,onclick:()=>{
    if(state.answered) return; row.querySelectorAll('button').forEach(b=>b.disabled=true);
    const ok=id===Q.answer; row.querySelector(`[data-id=${Q.answer}]`).classList.add('correct');
    resolve(Q,ok?1:0,fb,{answer:Q.answer==='me'?'Я':'Ти'});
  },'data-id':id});
  const row=el('div',{class:'row2'},mk('me','🙋‍♂️ Я'),mk('you','🙋‍♀️ Ти'));
  shell(Q,row,fb);
}

/* --- 📝 заповни пропуски: Q.text з {0},{1}; Q.blanks=[{options:[…],answer:"…"}] --- */
function fillScreen(Q){
  state.answered=false; const fb=el('div'), sels=[];
  const para=el('p',{class:'fill'});
  Q.text.split(/(\{\d+\})/).forEach(part=>{
    const m=part.match(/^\{(\d+)\}$/);
    if(!m) return para.append(part);
    const b=Q.blanks[+m[1]];
    const s=el('select',{},el('option',{value:'',text:'— обери —'}),...shuffle(b.options).map(o=>el('option',{value:o,text:o})));
    sels[+m[1]]=s; para.append(s);
  });
  const btn=el('button',{class:'btn',text:'Перевірити ✅'});
  btn.addEventListener('click',()=>{
    if(sels.some(s=>!s.value)||state.answered) return; btn.remove();
    let hits=0; sels.forEach((s,i)=>{ s.disabled=true; const ok=s.value===Q.blanks[i].answer; if(ok) hits++; s.classList.add(ok?'ok':'no'); });
    resolve(Q,hits/sels.length,fb,{answer:Q.blanks.map(b=>b.answer).join(', '),detail:`${hits}/${sels.length}`+(hits<sels.length?` • Правильно: ${Q.blanks.map(b=>b.answer).join(', ')}`:'')});
  });
  shell(Q,para,btn,fb);
}

/* --- 📍 карта: Q.image (необов'язково), Q.target={x,y} у %, Q.radius у % --- */
function mapScreen(Q){
  state.answered=false; const fb=el('div'); let pt=null;
  const map=el('div',{class:'map'+(Q.image?' img':'')});
  if(Q.image) map.style.backgroundImage=`url(${Q.image})`;
  else (Q.landmarks||[['🏠',15,20],['🌳',70,25],['⛲',45,55],['🏪',20,75],['🎡',80,70]]).forEach(([e,x,y])=>{
    const l=el('span',{class:'lm',text:e}); l.style.left=x+'%'; l.style.top=y+'%'; map.append(l); });
  const pin=el('span',{class:'pin',text:'📍'});
  map.addEventListener('click',e=>{
    if(state.answered) return; const r=map.getBoundingClientRect();
    pt={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};
    pin.style.left=pt.x+'%'; pin.style.top=pt.y+'%'; map.append(pin); btn.disabled=false; vibrate(10);
  });
  const btn=el('button',{class:'btn',text:'Підтвердити 📍',disabled:''});
  btn.addEventListener('click',()=>{
    if(!pt||state.answered) return; btn.remove();
    const rad=Q.radius||12, d=Math.hypot(pt.x-Q.target.x,pt.y-Q.target.y);
    const ratio=d<=rad?1:d<=rad*2?.5:0;
    const z=el('span',{class:'tzone'}); z.style.cssText=`left:${Q.target.x}%;top:${Q.target.y}%;width:${rad*2}%;aspect-ratio:1`; 
    const h=el('span',{class:'lm',text:'❤️'}); h.style.left=Q.target.x+'%'; h.style.top=Q.target.y+'%';
    map.append(z,h);
    resolve(Q,ratio,fb,{answer:Q.answerText||'на карті',detail:ratio===1?'У яблучко!':ratio?'Майже, зовсім близько!':'Далеко…'});
  });
  shell(Q,el('p',{class:'center',style:'font-size:.9rem',text:'Тапни на карті там, де це було'}),map,btn,fb);
}

/* --- 🖼️ піксельне фото: Q.image (або Q.emoji), Q.options (перший — правильний) --- */
function pixelScreen(Q){
  state.answered=false; const fb=el('div');
  const cv=el('canvas',{class:'pcv',width:'300',height:'300'}), ctx=cv.getContext('2d');
  const src=document.createElement('canvas'); src.width=src.height=300; const sx=src.getContext('2d');
  const STEPS=[6,9,14,22,40,90,300]; let st=0;
  const drawSrc=img=>{ sx.fillStyle='#fff0f6'; sx.fillRect(0,0,300,300);
    if(img) sx.drawImage(img,0,0,300,300); else { sx.font='200px serif'; sx.textAlign='center'; sx.textBaseline='middle'; sx.fillText(Q.emoji,150,165); } paint(); };
  const paint=()=>{ const s=STEPS[st], off=document.createElement('canvas'); off.width=off.height=s;
    off.getContext('2d').drawImage(src,0,0,s,s); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,300,300); ctx.drawImage(off,0,0,300,300); };
  if(Q.image){ const im=new Image(); im.onload=()=>drawSrc(im); im.onerror=()=>drawSrc(null); im.src=Q.image; } else drawSrc(null);
  const id=setInterval(()=>{ if(st<STEPS.length-1){st++;paint();} else clearInterval(id); },1400); onCleanup(()=>clearInterval(id));
  const correct=Q.options[0];
  const btns=shuffle(Q.options).map(o=>{const b=el('button',{class:'opt',text:o});
    b.addEventListener('click',()=>{ if(state.answered) return; clearInterval(id); st=STEPS.length-1; paint();
      btns.forEach(x=>{x.disabled=true; if(x.textContent===correct) x.classList.add('correct');});
      const ok=o===correct; if(!ok) b.classList.add('wrong');
      const early=1-(Math.min(st0,STEPS.length-1)/(STEPS.length-1))*.5;
      resolve(Q,ok?1:0,fb,{gain: ok ? Math.round(POINTS*early)+(state.streak>0?STREAK_BONUS*state.streak:0) : 0, answer:correct, detail: ok?`Вгадала на кроці ${st0+1}/${STEPS.length}`:''}); });
    return b;});
  let st0=0; const track=setInterval(()=>{st0=st;},100); onCleanup(()=>clearInterval(track));
  shell(Q,el('p',{class:'center',style:'font-size:.9rem',text:'Фото поступово проявляється. Чим раніше вгадаєш, тим більше очок!'}),cv,...btns,fb);
}

const TYPES={slider:sliderScreen,order:orderScreen,swipe:swipeScreen,text:textScreen,who:whoScreen,fill:fillScreen,map:mapScreen,pixel:pixelScreen};

/* --- 🎡 колесо фортуни (міні-гра). WHEEL — призи/завдання, редагуй --- */
const WHEEL=["🤗 Обійми без ліміту","🍫 Шоколадка","😘 Поцілунок","💆 Масаж 10 хв","🍕 Піца за мій рахунок","🎬 Ти обираєш фільм","🌹 Квіти","🥰 Комплімент ×3"];
function gameWheel(done){
  const n=WHEEL.length, seg=360/n, cols=['#ff9ec7','#ffd6e8','#ff74ad','#ffc2d9'];
  const wheel=el('div',{class:'wheel'});
  wheel.style.background=`conic-gradient(${WHEEL.map((_,i)=>`${cols[i%4]} ${i*seg}deg ${(i+1)*seg}deg`).join(',')})`;
  WHEEL.forEach((t,i)=>{ const l=el('span',{class:'wl',text:t}); l.style.transform=`rotate(${i*seg+seg/2}deg) translateY(-92px)`; wheel.append(l); });
  const btn=el('button',{class:'btn',text:'Крутити! 🎡'}); let spun=false, rot=0;
  btn.addEventListener('click',()=>{
    if(spun) return; spun=true; btn.disabled=true;
    rot=360*5+Math.random()*360; wheel.style.transform=`rotate(${rot}deg)`;
    const ang=(360-(rot%360))%360, idx=Math.floor(ang/seg);
    const tm=setTimeout(()=>done(60,`Випало: ${WHEEL[idx]} — це твій приз! Забереш при зустрічі 😘`),4300); onCleanup(()=>clearTimeout(tm));
  });
  playCard('Колесо фортуни', el('p',{text:'Крути і дізнайся приз!'}), el('div',{class:'wheelbox'},el('div',{class:'wptr',text:'▼'}),wheel), btn);
}
gameWheel.intro=go=>introCard('🎡','Колесо фортуни','Одне обертання — один гарантований приз. Бо ти заслужила 💕',go);

/* --- 🎰 подряпай-картка для фінального подарунка --- */
function scratchify(box,onDone){
  const w=box.offsetWidth,h=box.offsetHeight, cv=el('canvas',{class:'scratch',width:w,height:h}), c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,w,h); g.addColorStop(0,'#ff9ec7'); g.addColorStop(.5,'#ffd6e8'); g.addColorStop(1,'#ff74ad');
  c.fillStyle=g; c.fillRect(0,0,w,h); c.fillStyle='#fff'; c.font='600 22px Fredoka,sans-serif'; c.textAlign='center'; c.fillText('✨ ПОДРЯПАЙ ПАЛЬЦЕМ ✨',w/2,h/2);
  c.globalCompositeOperation='destination-out'; let down=false,mv=0,done=false;
  const sc=e=>{ const r=cv.getBoundingClientRect(); c.beginPath(); c.arc(e.clientX-r.left,e.clientY-r.top,22,0,7); c.fill(); if(++mv%8===0) chk(); };
  const chk=()=>{ const d=c.getImageData(0,0,w,h).data; let z=0,t=0; for(let i=3;i<d.length;i+=64){t++; if(d[i]<20) z++;} if(!done&&z/t>.5){done=true;cv.classList.add('gone');setTimeout(()=>cv.remove(),600);onDone();} };
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);sc(e);});
  cv.addEventListener('pointermove',e=>{if(down)sc(e);}); cv.addEventListener('pointerup',()=>down=false);
  box.append(cv);
}


startScreen();
