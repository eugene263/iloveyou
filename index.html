<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec7">
<title>Наскільки ти знаєш нас?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-50:#fff0f6; --pink-100:#ffdeeb; --pink-200:#ffc2d9; --pink-300:#ff9ec7;
    --pink-400:#ff74ad; --pink-500:#f0509a; --pink-700:#a82d66; --ink:#5b2342;
    --ok:#3ecf8e; --bad:#ff6b81; --card:#ffffffd9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffe3ef 0%,#ffc2d9 50%,#ffd6e8 100%) fixed;
    min-height:100dvh; overflow-x:hidden;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:.7}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 0 40px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .card{
    background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:26px 22px;
    box-shadow:0 10px 0 var(--pink-300),0 20px 40px #f0509a40;border:3px solid #fff;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:2.1rem;line-height:1.25;margin:0 0 10px;color:var(--pink-500);text-align:center}
  h2{font-size:1.35rem;line-height:1.3;margin:0 0 18px;text-align:center}
  p{line-height:1.5;margin:0 0 14px}
  .center{text-align:center}
  .big-emoji{font-size:4.2rem;text-align:center;animation:bob 2s ease-in-out infinite;display:block;margin-bottom:6px}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}

  input[type=text]{
    width:100%;font:inherit;font-size:1.1rem;padding:14px 18px;border-radius:18px;
    border:3px solid var(--pink-200);background:#fff;color:var(--ink);outline:none;text-align:center;margin-bottom:14px;
  }
  input[type=text]:focus{border-color:var(--pink-400)}

  .btn{
    display:block;width:100%;font:inherit;font-weight:600;font-size:1.1rem;color:#fff;
    background:linear-gradient(180deg,var(--pink-400),var(--pink-500));border:0;border-radius:20px;
    padding:15px 18px;cursor:pointer;box-shadow:0 6px 0 var(--pink-700);transition:transform .1s,box-shadow .1s;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-700)}
  .btn.ghost{background:#fff;color:var(--pink-500);box-shadow:0 6px 0 var(--pink-200);margin-top:14px}
  .btn.ghost:active{box-shadow:0 1px 0 var(--pink-200)}

  /* HUD */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:14px;font-weight:600}
  .pill{background:#fff;border-radius:99px;padding:5px 10px;box-shadow:0 3px 0 var(--pink-200);font-size:.82rem;white-space:nowrap}
  .bar{height:14px;background:#fff;border-radius:99px;overflow:hidden;margin-bottom:18px;box-shadow:inset 0 2px 4px #f0509a30}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));border-radius:99px;transition:width .5s cubic-bezier(.2,1.2,.4,1)}

  .opt{
    display:block;width:100%;text-align:left;font:inherit;font-size:1.05rem;color:var(--ink);
    background:#fff;border:3px solid var(--pink-200);border-radius:18px;padding:13px 16px;margin-bottom:11px;
    cursor:pointer;box-shadow:0 4px 0 var(--pink-200);transition:transform .1s,background .2s,border-color .2s;
  }
  .opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--pink-200)}
  .opt.correct{background:#d9fbe9;border-color:var(--ok);box-shadow:0 4px 0 #2aa972;animation:jump .5s}
  .opt.wrong{background:#ffe0e5;border-color:var(--bad);box-shadow:0 4px 0 #d6455d;animation:shake .45s}
  .opt.gone{opacity:.25;text-decoration:line-through}
  .opt:disabled{cursor:default}
  @keyframes jump{40%{transform:scale(1.05)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  .hint{background:none;border:0;font:inherit;color:var(--pink-500);font-weight:600;cursor:pointer;display:block;margin:6px auto 0;padding:6px}
  .hint:disabled{opacity:.4;cursor:default}

  .feedback{margin-top:8px;padding:14px;border-radius:18px;text-align:center;font-weight:500;animation:pop .35s}
  .feedback.ok{background:#d9fbe9}
  .feedback.no{background:#ffe0e5}

  /* runaway */
  .arena{position:relative;height:180px;margin-bottom:10px}
  .arena .btn{position:absolute;width:auto;padding:14px 28px}
  #yes{left:8%;top:30px;transition:transform .2s}
  #no{right:8%;top:30px;background:linear-gradient(180deg,#b5b5c3,#8e8ea0);box-shadow:0 6px 0 #6b6b7b;transition:left .15s,top .15s}

  /* result */
  .score{font-size:3.4rem;font-weight:700;color:var(--pink-500);text-align:center;line-height:1}
  .rank{font-family:'Pacifico',cursive;font-size:1.6rem;text-align:center;margin:8px 0 14px;color:var(--pink-700)}
  .recap{margin:16px 0 0;padding:0;list-style:none;font-size:.95rem}
  .recap li{display:flex;gap:8px;padding:7px 0;border-bottom:2px dashed var(--pink-200)}
  .recap li:last-child{border:0}
  .recap b{font-weight:600}

  .conf{position:fixed;top:-20px;z-index:10;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
  /* mini-games */
  .game-box{position:relative;background:#fff;border:3px dashed var(--pink-300);border-radius:22px;padding:14px;margin-bottom:14px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .meter{height:22px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin:10px 0}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb86b,var(--pink-500));transition:width .1s}
  .cat{font-size:5rem;line-height:1.1;transition:transform .1s;min-height:180px;display:grid;place-items:center}
  .cat.bump{transform:scale(1.18) rotate(-5deg)}
  .timer{font-weight:700;font-size:1.3rem;color:var(--pink-500)}
  .sky{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(#fff6fa,#ffe3ef)}
  .drop{position:absolute;top:-50px;font-size:2.4rem;cursor:pointer;border:0;background:none;padding:6px;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(360px)}}
  .track{position:relative;height:46px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin:18px 0}
  .zone{position:absolute;top:0;bottom:0;background:#9af0c4;border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
  .marker{position:absolute;top:2px;font-size:2.4rem;line-height:1;transform:translateX(-50%)}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .mc{aspect-ratio:1;font-size:2rem;border:3px solid var(--pink-200);border-radius:16px;background:var(--pink-300);color:transparent;cursor:pointer;box-shadow:0 4px 0 var(--pink-400);transition:transform .25s;font:inherit;font-size:2rem}
  .mc.up{background:#fff;color:inherit;transform:rotateY(0)}
  .mc.done{background:#d9fbe9;border-color:var(--ok);box-shadow:none}
  .kbd{display:inline-block;background:var(--pink-100);border-radius:8px;padding:2px 10px;font-weight:600;box-shadow:0 3px 0 var(--pink-200)}

  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:100;background:#fff;border:3px solid var(--pink-400);border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--pink-300);text-align:center;animation:toast 3.2s forwards;max-width:90vw}
  .toast small{display:block;font-size:.8rem;opacity:.8}
  @keyframes toast{0%{transform:translate(-50%,-90px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-120px)}}
  .qphoto{display:block;width:100%;max-height:260px;object-fit:cover;object-position:center 30%;border-radius:20px;border:4px solid #fff;box-shadow:0 6px 0 var(--pink-200);margin:0 auto 14px}
  .achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .ach{background:var(--pink-100);border-radius:14px;padding:8px 4px;opacity:.55;font-size:1.6rem;text-align:center}
  .ach.on{background:#fff;opacity:1;box-shadow:0 3px 0 var(--pink-300)}
  .ach small{display:block;font-size:.7rem;line-height:1.1;margin-top:2px}
  .ticket{border:4px dashed var(--pink-400);border-radius:22px;background:#fff;padding:18px;margin-bottom:6px}
  .ticket p{margin:0 0 8px}
  .gift-btn{background:linear-gradient(120deg,#ff5fa2,#ffb347,#ff5fa2,#b86bff);background-size:300% 300%;animation:giftgrad 3s linear infinite,giftpulse 1.4s ease-in-out infinite;box-shadow:0 6px 0 #c9357a,0 0 22px rgba(255,95,162,.7);position:relative;overflow:hidden;font-size:1.15rem}
  .gift-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:giftshine 2.2s ease-in-out infinite}
  @keyframes giftgrad{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  @keyframes giftpulse{50%{transform:scale(1.06)}}
  @keyframes giftshine{0%{left:-60%}60%,100%{left:130%}}
  .ticket .qphoto{max-height:none;height:auto;object-fit:contain}

  .srow{background:#fff;border:3px solid var(--pink-200);border-radius:18px;padding:12px 14px;margin-bottom:12px}
  .shead{display:flex;justify-content:space-between;font-size:1.1rem;margin-bottom:8px;font-weight:500}
  .sval{color:var(--pink-500);min-width:3.2ch;text-align:right}
  .strack{position:relative;height:12px;margin:12px 0 18px}
  .szone{position:absolute;z-index:2;top:-2px;height:16px;background:#3ecf8e66;border-radius:99px;border:2px solid var(--ok);pointer-events:none;animation:pop .4s}
  .sres{margin-top:6px;font-size:.9rem;font-weight:500;text-align:center}
  .sres.ok{color:#1f9d63}.sres.no{color:#d6455d}
  input[type=range]{-webkit-appearance:none;appearance:none;position:relative;z-index:1;width:100%;height:12px;background:transparent;margin:0;display:block;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--pink-100)}
  input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--pink-100)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-9px;border-radius:50%;background:var(--pink-500);border:4px solid #fff;box-shadow:0 3px 0 var(--pink-700)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--pink-500);border:4px solid #fff;box-shadow:0 3px 0 var(--pink-700)}
  input[type=range]:disabled{opacity:.9}
  .oitem{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--pink-200);border-radius:16px;padding:8px 10px;margin-bottom:9px}
  .oitem.ok{background:#d9fbe9;border-color:var(--ok)}.oitem.no{background:#ffe0e5;border-color:var(--bad)}
  .onum{width:28px;height:28px;border-radius:50%;background:var(--pink-300);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
  .otxt{flex:1;text-align:left}
  .ob{border:0;background:var(--pink-100);color:var(--pink-500);border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer}.ob:disabled{opacity:.3}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
  .who{font:inherit;font-size:1.2rem;font-weight:600;padding:22px 8px;border:3px solid var(--pink-200);border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--pink-200);cursor:pointer}
  .who.correct{background:#d9fbe9;border-color:var(--ok)}
  .sstage{position:relative;height:150px;margin:8px 0 14px}
  .scard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:#fff;border:3px solid var(--pink-300);border-radius:22px;box-shadow:0 6px 0 var(--pink-200);font-size:1.15rem;touch-action:pan-y;cursor:grab;transition:transform .25s,opacity .25s}
  .scard.fly-r{transform:translateX(130%) rotate(18deg)!important;opacity:0}.scard.fly-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
  .scard.cok{border-color:var(--ok)}.scard.cno{border-color:var(--bad)}
  .fill{font-size:1.15rem;line-height:2.3;text-align:center}
  select{font:inherit;font-size:1rem;padding:6px 8px;border-radius:12px;border:3px solid var(--pink-200);background:#fff;color:var(--ink);max-width:100%}
  select.ok{border-color:var(--ok);background:#d9fbe9}select.no{border-color:var(--bad);background:#ffe0e5}
  .map{position:relative;height:250px;border-radius:20px;border:4px solid #fff;box-shadow:0 5px 0 var(--pink-200);overflow:hidden;cursor:crosshair;margin-bottom:12px;
    background:linear-gradient(90deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(0deg,transparent 40%,#fff 40% 47%,transparent 47%),linear-gradient(#ffe9f2,#ffd6e8);}
  .map.img{background-size:cover;background-position:center}
  .lm{position:absolute;transform:translate(-50%,-50%);font-size:1.6rem;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);font-size:2rem;pointer-events:none;animation:jump .4s}
  .tzone{position:absolute;transform:translate(-50%,-50%);border:3px dashed var(--ok);background:#3ecf8e44;border-radius:50%;pointer-events:none}
  .pcv{width:100%;max-width:300px;display:block;margin:0 auto 14px;border-radius:20px;border:4px solid #fff;box-shadow:0 5px 0 var(--pink-200);background:#fff}
  .wheelbox{position:relative;width:280px;height:300px;margin:0 auto 14px}
  .wheel{position:absolute;top:20px;left:0;width:280px;height:280px;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 var(--pink-300);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
  .wl{position:absolute;left:50%;top:50%;font-size:.62rem;font-weight:600;white-space:nowrap;color:var(--ink);width:96px;margin-left:-48px;margin-top:-8px;text-align:center;white-space:normal;line-height:1.05}
  .wptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:2;color:var(--pink-700)}
  .ticketbox{position:relative;margin-bottom:6px}
  .scratch{position:absolute;inset:0;border-radius:22px;touch-action:none;transition:opacity .6s;cursor:grab}.scratch.gone{opacity:0}

  .xp{margin-bottom:18px;cursor:pointer}
  .xtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .xtop small{opacity:.8;font-size:.78rem;text-align:right}
  .xtrack{position:relative;height:16px;background:#fff;border-radius:99px;margin:0 14px;box-shadow:inset 0 2px 4px #f0509a30}
  .xtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));transition:width .9s cubic-bezier(.2,1.1,.4,1)}
  .xm{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1rem;background:#fff;border:2px solid var(--pink-200);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;filter:grayscale(.6);z-index:1}
  .xm.on{filter:none;border-color:var(--pink-500);animation:jump .5s}
  .toast.big{background:linear-gradient(#fff,#ffe3ef);border-color:var(--pink-500);font-size:1.1rem;cursor:pointer}
  .ov{position:fixed;inset:0;background:#5b234266;z-index:90;display:grid;place-items:center;padding:16px;animation:pop .25s}
  .modal{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:440px;max-height:88dvh;overflow:auto;border:4px solid var(--pink-300)}
  .lvls{list-style:none;margin:0 0 14px;padding:0}
  .lvls li{display:flex;gap:12px;align-items:center;padding:9px 6px;border-bottom:2px dashed var(--pink-200);opacity:.55}
  .lvls li.on{opacity:1}
  .lvls .li{font-size:1.8rem;width:42px;text-align:center}
  .lvls .lt{font-size:.95rem;line-height:1.3}
  .gcv{display:block;width:100%;height:auto;max-width:420px;margin:0 auto 4px;border-radius:18px;border:4px solid #fff;box-shadow:0 4px 0 var(--pink-200);touch-action:manipulation;background:#fff;cursor:pointer}
  .hudline{display:flex;justify-content:space-between;align-items:center}
  .parena{position:relative;height:250px;border-radius:20px;border:4px solid #fff;margin:8px 0;overflow:hidden;touch-action:manipulation;cursor:pointer;background:repeating-linear-gradient(90deg,#d99a58 0 58px,#c4863f 58px 62px)}
  .pitem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:4rem;transition:transform .15s cubic-bezier(.3,1.6,.5,1);pointer-events:none}.pitem.show{transform:translate(-50%,-50%) scale(1)}
  .paw{position:absolute;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;transition:transform .2s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
  .paw.pl{left:10%;bottom:-30px;background:#fff;border:4px solid #2b2233}.paw.pl.grab{transform:translate(95px,-95px)}
  .paw.cp{right:10%;top:-30px;background:#f5a623;border:4px solid #8a5a00}.paw.cp.grab{transform:translate(-95px,95px)}
  .paw.stun{animation:shake .4s 2;filter:grayscale(1)}

  .hudback{border:0;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
  .stage-ov{position:fixed;inset:0;background:#1a0b14;z-index:50;overflow:hidden;touch-action:none}
  .stg{position:absolute;left:50%;top:50%;width:2000px;height:923px;transform-origin:center center;touch-action:none;user-select:none;-webkit-user-select:none}
  .stg canvas{display:block;width:2000px;height:923px}
  .stg-home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:120px;height:62px;border-radius:31px;border:0;background:#ffffff33;color:#fff;font-size:40px;cursor:pointer}

  .wmap,.lpath{position:relative;width:300px;margin:0 auto}
  .wsvg{position:absolute;left:0;top:0;pointer-events:none}
  .wdeco{position:absolute;font-size:1.6rem;opacity:.55;pointer-events:none}
  .wnode{position:absolute;width:88px;height:88px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 0 #00000022;font-size:2.4rem;cursor:pointer;display:grid;place-items:center;transition:transform .15s;padding:0}
  .wnode:active{transform:scale(.94)}.wnode.cur{animation:bob 1.6s ease-in-out infinite;box-shadow:0 0 0 6px #fff9,0 6px 0 #00000022}.wnode.full{box-shadow:0 0 0 5px #ffd23f,0 6px 0 #00000022}
  .wnode.lock{cursor:not-allowed;opacity:.85}
  .wchip{position:absolute;width:150px;text-align:center;background:#fff;border-radius:14px;padding:4px 6px;box-shadow:0 3px 0 var(--pink-200);line-height:1.15}
  .wchip small{display:block;opacity:.7;font-size:.75rem}
  .wpin{position:absolute;font-size:2rem;animation:bob 1.2s ease-in-out infinite;pointer-events:none}
  .lnode{position:absolute;width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:var(--lc,#ff9ec7);box-shadow:0 5px 0 #00000022;display:grid;place-items:center;font-size:1.5rem;cursor:pointer;padding:0}
  .lnode.boss{width:68px;height:68px;font-size:1.9rem;border-color:#ffd23f}
  .lnode.done{background:#9af0c4}.lnode.lock{background:#d8ccd3;cursor:not-allowed}
  .lnode.cur{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.14);box-shadow:0 0 0 8px #ffffffaa,0 5px 0 #00000022}}
  .lnum{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--pink-500);font-size:.75rem;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 0 var(--pink-200)}
  .lstar{position:absolute;width:60px;text-align:center;font-size:.7rem;pointer-events:none}

  .mnode{position:absolute;transform:translate(-50%,-50%);width:136px;height:136px;border-radius:50%;border:9px solid #fff;box-shadow:0 10px 0 #00000026;font-size:70px;display:grid;place-items:center;cursor:pointer;padding:0;line-height:1}
  .mnode.cur{animation:mpulse 1.4s ease-in-out infinite}.mnode.full{box-shadow:0 0 0 8px #ffd23f,0 10px 0 #00000026}.mnode.lock{cursor:not-allowed}
  @keyframes mpulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
  @keyframes sshake{20%,60%{transform:translate(calc(-50% - 10px),-50%)}40%,80%{transform:translate(calc(-50% + 10px),-50%)}}
  .mnode.shake,.snode.shake{animation:sshake .45s}

const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

function enterLocation(li){
  const L=WORLD[li], n=L.levels.length, prog=locProgress(li);
  if(prog>=n){ if(DEV_UNLOCK_ALL){ startLevel(li,0); return; } toast(`Локацію «${L.name}» вже пройдено ✅`); return; }
  const k=L.levels.findIndex((_,j)=>!state.done[li+'-'+j]);
  startLevel(li,k<0?0:k);
}
function startLevel(li,k){
  stopGame(); state.loc=li; state.lv=k; state.lastStars=1; state.answered=false;
  const tok=WORLD[li].levels[k];
  if(tok==='boss') return bossScreen();
  if(tok.startsWith('g:')) return gameIntro(GAME_BY[tok.slice(2)]());
  questionScreen(QUESTIONS.find(q=>q.id===tok));
}
function levelDone(){
  stopGame();
  const li=state.loc,k=state.lv,key=li+'-'+k, wasFull=locProgress(li)===WORLD[li].levels.length;
  state.done[key]=Math.max(state.done[key]||0,state.lastStars||1);
  saveGame();
  if(WORLD[li].levels[k]==='boss') return resultScreen();
  if(k>=WORLD[li].levels.length-1) return locationComplete(li,wasFull);
  startLevel(li,k+1);
}
function locationComplete(li,wasFull){
  const L=WORLD[li], next=WORLD[li+1];
  state.lives=3; if(!wasFull) state.score+=LOC_BONUS; confetti(110); vibrate([40,30,40,30,80]); saveGame();
  render(el('div',{class:'card center'},
    el('span',{class:'big-emoji',text:'🏁'}),
    el('h2',{text:`Локацію «${L.name}» пройдено!`}),
    el('p',{text:`+${LOC_BONUS} ⭐ бонус • сердечка відновлено ❤️❤️❤️`}),
    next ? el('p',{text:`Відкрито нову локацію: ${next.emoji} ${next.name}`}) : '',
    el('button',{class:'btn',text:'До карти 🗺️',onclick:worldMap})));
}

function sliderScreen(Q){
  state.answered = false;
  const tol = Q.tolerance ?? 10, PER = 40;
  const rows = Q.items.map(it => {
    const out = el('b',{class:'sval',text:'50%'});
    const inp = el('input',{type:'range',min:'0',max:'100',value:'50',step:'1'});
    inp.addEventListener('input',()=>{ out.textContent=inp.value+'%'; });
    const res = el('div',{class:'sres'});
    const track = el('div',{class:'strack'},inp);
    return { it, inp, res, node: el('div',{class:'srow'},
      el('div',{class:'shead'},el('span',{text:`${it.emoji} ${it.label}`}),out), track, res) };
  });
  const fb = el('div');
  const check = el('button',{class:'btn',text:'Перевірити ✅'});
  check.addEventListener('click',()=>{
    if(state.answered) return; state.answered = true; check.remove();
    let hits = 0;
    rows.forEach(r => {
      const v = +r.inp.value, a = r.it.answer, ok = Math.abs(v-a) <= tol;
      r.inp.disabled = true; if(ok) hits++;
      const zone = el('i',{class:'szone'}); zone.style.left = Math.max(0,a-tol)+'%'; zone.style.width = (Math.min(100,a+tol)-Math.max(0,a-tol))+'%';
      r.node.querySelector('.strack').prepend(zone);
      r.res.className = 'sres '+(ok?'ok':'no');
      r.res.textContent = ok ? `✅ Влучила! Правильно ${a}%` : `❌ Ти: ${v}%, правильно: ${a}%`;
    });
    const isRight = hits === rows.length; state.lastStars=isRight?3:hits>0?2:1;
    const gain = hits*PER + (isRight ? POINTS-hits*PER+ (state.streak>0?sb(state.streak):0) : 0);
    state.score += gain;
    if(isRight){ state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak); confetti(30); vibrate(30); if(state.streak>=5) award('fire'); award('slider'); }
    else { state.streak = 0; if(hits===0){ state.lives--; } vibrate([60,40,60]); }
    state.log.push({q:Q.q,right:isRight,answer:Q.items.map(x=>`${x.label} ${x.answer}%`).join(', ')});
    fb.replaceChildren(
      el('div',{class:'feedback '+(isRight?'ok':'no'),text:`${hits}/${rows.length} влучань, +${gain} очок. `+(isRight?Q.ok:Q.no)}),
      el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : 'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion}));
  });
  render(el('div',{class:'card'}, ...hud(),
    emojiEl(Q),
    el('h2',{text:Q.q}),

function questionScreen(Q){
  if(Q.type&&TYPES[Q.type]) return TYPES[Q.type](Q);
  state.answered = false;
  const correct = Q.options[0];
  const opts = shuffle(Q.options);
  const btns = opts.map(o => {
    const b = el('button',{class:'opt',text:o});
    b.addEventListener('click',()=>answer(b,o===correct));
    return b;
  });
  const fb = el('div');
  const hintBtn = el('button',{class:'hint',text:`💡 Підказка (${state.hints})`});
  if(!state.hints) hintBtn.disabled = true;
  hintBtn.addEventListener('click',()=>{
    if(state.answered||!state.hints) return;
    state.hints--;
    shuffle(btns.filter(b=>b.textContent!==correct)).slice(0,2).forEach(b=>{b.classList.add('gone');b.disabled=true;});
    hintBtn.textContent=`💡 Підказка (${state.hints})`; hintBtn.disabled=true;
  });

  function answer(btn, isRight){
    if(state.answered) return; state.answered = true;
    btns.forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add('correct'); });
    hintBtn.disabled = true;
    let gain = 0;
    if(isRight){
      state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak);
      gain = POINTS + (state.streak>1 ? sb(state.streak-1) : 0);
      state.score += gain; confetti(24); vibrate(30); if(state.streak>=5) award('fire');
    } else {
      btn.classList.add('wrong'); state.streak = 0; state.lives--; vibrate([60,40,60]);
    }
    state.log.push({q:Q.q,right:isRight,answer:correct}); state.lastStars=isRight?3:1;
    fb.replaceChildren(
      el('div',{class:'feedback '+(isRight?'ok':'no'),text:(isRight?`+${gain} очок! `:'Мимо! ')+(isRight?Q.ok:Q.no)}),
      el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : 'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion})
    );
  }

  render(el('div',{class:'card'}, ...hud(),
    Q.photo ? el('img',{class:'qphoto',src:Q.photo,alt:''}) : emojiEl(Q),
    el('h2',{text:Q.q}), ...(Q.options.length>6?[el('div',{class:'optgrid'},...btns)]:btns), hintBtn, fb));
}

function gameCat(done){
  const GOAL=30; let n=0, over=false;
  const catSrc = i => `photos/cat/cat${i+1}.png`;
  for(let i=0;i<5;i++){ const pre=new Image(); pre.src=catSrc(i); }   // прогрів кеша
  let stage=0;
  const catPic=el('img',{class:'catpng',src:catSrc(0),alt:'кіт'}), cat=el('div',{class:'cat'},catPic), m=el('i'), tm=el('div',{class:'timer'});
  const press=()=>{
    if(over) return; n++;
    m.style.width=Math.min(100,n/GOAL*100)+'%';
    const ns=Math.min(4,Math.floor(n/GOAL*5));
    if(ns!==stage){ stage=ns; catPic.src=catSrc(stage); }
    cat.classList.add('bump'); setTimeout(()=>cat.classList.remove('bump'),80);
    dropFish(1); vibrate(8);
    if(n>=GOAL){ award('cat'); end(); }
  };
  const box=el('div',{class:'game-box'},cat,el('div',{class:'meter'},m),tm);
  /* рибки летять від кнопки знизу вгору до кота */
  function dropFish(k){
    const wr=wrap.getBoundingClientRect(), br=btn.getBoundingClientRect(), cr=catPic.getBoundingClientRect();
    for(let i=0;i<k;i++){
      const f=el('span',{class:'fishdrop',text:pick(['🐟','🐟','🐠','🐟','🍣'])});
      const sx=br.left+br.width/2+(Math.random()*120-60)-wr.left, sy=br.top+br.height/2-wr.top;
      const tx=cr.left+cr.width/2+(Math.random()*50-25)-wr.left, ty=cr.top+cr.height*0.55-wr.top;
      f.style.left=(sx-16)+'px'; f.style.top=(sy-16)+'px';
      f.style.setProperty('--dx',(tx-sx)+'px'); f.style.setProperty('--dy',(ty-sy)+'px'); f.style.setProperty('--r',(Math.random()*120-60)+'deg');
      f.style.animationDelay=(i*70)+'ms'; wrap.append(f); setTimeout(()=>f.remove(),800+i*70);
    } }
  const key=e=>{ if(e.code==='Space'){e.preventDefault(); if(!e.repeat) press();} };
  document.addEventListener('keydown',key); onCleanup(()=>document.removeEventListener('keydown',key));
  const btn=el('button',{class:'btn',text:'🐟 ГОДУЙ! 🐟',onclick:press});
  const wrap=el('div',{class:'fishwrap'},box,btn);
  function end(){
    if(over) return; over=true;
    const pts=Math.min(150,Math.round(n/GOAL*150)), win=n>=GOAL;
    const finish=()=>done(pts, win ? 'Котик наїдений 🐱' : n>=GOAL/2 ? `Котик частково наїдений (${n} рибок). Лишився трохи голодний 😺` : `Котик ображений: лише ${n} рибок 😿`, catSrc(win?4:stage));
    if(win){ catPic.src=catSrc(4); dropFish(14); confetti(30); later(finish,1500); } else finish();
  }
  playCard('Нагодуй голодного котика!',
    el('p',{},'Швидко клацай ',el('span',{class:'kbd',text:'ПРОБІЛ'}),' (або тапай по кнопці) — за 7 секунд!'),
    wrap);
  countdown(7,t=>tm.textContent=`⏱ ${t}`,end);
}

/* 3) Ідеальний поцілунок — зупини рухомий маркер у зеленій зоні */
function gameKiss(done){
  let hits=0, tries=0; const MAX=3; let over=false;
  const track=el('div',{class:'track'}), zone=el('div',{class:'zone'}), mk=el('div',{class:'marker',text:'💋'});
  const info=el('p',{class:'timer',text:`Спроба 1/${MAX}`});
  track.append(zone,mk);
  let pos=0, dir=1, speed=1.1; let raf, last=performance.now();
  const newZone=()=>{ const w=Math.max(12,22-tries*3), l=10+Math.random()*(80-w); zone.style.left=l+'%'; zone.style.width=w+'%'; zone._l=l; zone._w=w; };
  newZone();
  const loop=now=>{
    const dt=now-last; last=now;
    pos+=dir*speed*dt/16; if(pos>=100){pos=100;dir=-1} if(pos<=0){pos=0;dir=1}
    mk.style.left=pos+'%'; raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop); onCleanup(()=>cancelAnimationFrame(raf));
  const stop=()=>{
    if(over) return; tries++;
    const ok = pos>=zone._l && pos<=zone._l+zone._w;
    if(ok){hits++; vibrate(30);} else vibrate([40,30,40]);
    info.textContent = ok?'💥 ЧМОК!':'🙈 Мимо!';
    if(tries>=MAX){ over=true; cancelAnimationFrame(raf);
      if(hits===3) award('sniper');
      setTimeout(()=>done(hits*50, hits===3?'Усі три поцілунки влучили!':hits?`Влучила ${hits} з ${MAX}.`:'Жодного влучання, наступного разу вийде.'),700);
    } else setTimeout(()=>{ speed+=.5; newZone(); info.textContent=`Спроба ${tries+1}/${MAX}`; },600);
  };
  const key=e=>{ if(e.code==='Space'){e.preventDefault(); if(!e.repeat) stop();} };
  document.addEventListener('keydown',key); onCleanup(()=>document.removeEventListener('keydown',key));
  playCard('Ідеальний поцілунок',
    el('p',{},'Натисни ',el('span',{class:'kbd',text:'ПРОБІЛ'}),' (або кнопку), коли 💋 у зеленій зоні!'),
    el('div',{class:'game-box'},info,track),
    el('button',{class:'btn',text:'💋 ЧМОК!',onclick:stop}));
}

  function end(){
    if(over) return; over=true;
    done(Math.min(150,n*10), n>=12?'Рекорд! Реакція на висоті.':n>=7?'Добре, але рекорд ще попереду.':'Повільно, спробуй ще раз.');

  const placeFood=()=>{ do{ food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }while(snake.some(p=>p.x===food.x&&p.y===food.y)); };
  placeFood();

    c.clearRect(0,0,cv.width,cv.height);
    c.font=(CELL-4)+'px serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('🐟',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
    snake.forEach((p,i)=>{ if(i===0){ c.fillText('🐱',p.x*CELL+CELL/2,p.y*CELL+CELL/2+1); } else { c.fillStyle=i%2?'#ff74ad':'#ff9ec7'; c.beginPath(); c.arc(p.x*CELL+CELL/2,p.y*CELL+CELL/2,CELL/2-3,0,7); c.fill(); } });
  };
  const finish=(crash)=>{
    if(over) return; over=true;
    done(Math.min(150,fish*15), fish>=GOAL?'Усіх рибок зібрано!':crash?`Моня врізалась. Рибок: ${fish}.`:`Час вийшов. Рибок: ${fish}.`);
  };
  const step=()=>{
    if(over) return; dir=next;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){ vibrate([40,30,40]); draw(); return finish(true); }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){ fish++; sc.textContent=`🐟 ${fish}/${GOAL}`; vibrate(10); if(fish>=GOAL){ draw(); return finish(false); } placeFood(); } else snake.pop();
    draw();
  };
  const turn=(x,y)=>{ if(x===-dir.x&&y===-dir.y) return; next={x,y}; };
  const id=setInterval(step,170); onCleanup(()=>clearInterval(id)); draw();
  const key=e=>{ const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]}[e.code]; if(m){ e.preventDefault(); turn(...m); } };
  document.addEventListener('keydown',key); onCleanup(()=>document.removeEventListener('keydown',key));
  let sx=0,sy=0;
  cv.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
  cv.addEventListener('pointerup',e=>{ const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<20) return; if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1); });
  const pad=(t,x,y)=>el('button',{class:'btn ghost',style:'margin:0;padding:10px 0;width:100%',text:t,onclick:()=>turn(x,y)});
  playCard('Змійка: Моня і рибки',
    el('p',{text:`Збери ${GOAL} рибок 🐟 за 45 секунд. Стрілки, свайп або кнопки. Не врізайся в стіни та власний хвіст!`}),
    el('div',{class:'game-box'},sc,tm,cv),
    el('div',{style:'display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center'},el('span'),pad('⬆️',0,-1),el('span'),pad('⬅️',-1,0),pad('⬇️',0,1),pad('➡️',1,0)));
  countdown(45,t=>tm.textContent=`⏱ ${t}`,()=>finish(false));
}
gameSnake.intro = go => introCard('🐍','Змійка: Моня і рибки','Моня росте з кожною рибкою. Керуй стрілками, свайпом або кнопками. Збери 10 рибок за 45 секунд і не врізайся!',go);

/* 4) Мемо-карточки */
function gameMemory(done){
  const faces=shuffle(['🐱','🍕','🌹','💍','🎀','🧸']); const pairs=faces.slice(0,6);
  const deck=shuffle([...pairs,...pairs]);
  let open=[], moves=0, found=0, lock=false;
  const info=el('p',{class:'timer',text:'Ходів: 0'});
  const grid=el('div',{class:'mem'});
  deck.forEach(f=>{
    const c=el('button',{class:'mc',text:'❔'}); c.dataset.f=f;
    c.addEventListener('click',()=>{
      if(lock||c.classList.contains('up')||c.classList.contains('done')) return;
      c.classList.add('up'); c.textContent=f; open.push(c); vibrate(8);
      if(open.length===2){
        moves++; info.textContent='Ходів: '+moves; lock=true;
        const [a,b]=open;
        if(a.dataset.f===b.dataset.f){
          a.classList.add('done');b.classList.add('done'); found++; open=[]; lock=false;
          if(found===pairs.length) setTimeout(()=>{ if(moves<=pairs.length+3) award('memory'); const pts=Math.max(40,200-(moves-pairs.length)*15);
            done(pts, moves<=pairs.length+3?'Чудова пам\'ять!':'Знайшла всі пари.'); },500);
        } else setTimeout(()=>{ [a,b].forEach(x=>{x.classList.remove('up');x.textContent='❔'}); open=[]; lock=false; },700);
      }
    });
    grid.append(c);
  });
  playCard('Знайди пари',
    el('p',{text:'Перевертай карточки і шукай однакові. Чим менше ходів — тим більше очок!'}),
    el('div',{class:'game-box'},info,grid));
}
gameMemory.intro = go => introCard('🃏','Знайди пари!','12 карточок, 6 пар. Тренуємо пам\'ять — вона знадобиться для питань про нас 😉',go);

/* =====================================================================
   🧩 НОВІ ФОРМАТИ ПИТАНЬ (type у QUESTIONS):
   order  — розклади по порядку   | swipe — правда/міф зі свайпом
   text   — ввести відповідь      | who   — «Хто з нас?»
   fill   — заповни пропуски      | map   — тапни на карті
   pixel  — піксельне фото
   ===================================================================== */
const emojiEl = Q => el('span',{class:'big-emoji'+(Array.from(Q.emoji).filter(c=>c!=='\uFE0F'&&c!=='\u200D').length>4?' long':''),text:Q.emoji});
function shell(Q, ...kids){
  render(el('div',{class:'card'}, ...hud(),
    Q.photo ? el('img',{class:'qphoto',src:Q.photo,alt:''}) : emojiEl(Q),
    el('h2',{text:Q.q}), ...kids));
}
/* спільне підбиття підсумку: ratio 0..1 */
function resolve(Q, ratio, fb, o={}){
  state.answered = true;
  const right = ratio >= .999; state.lastStars = right?3:ratio>0?2:1;
  const gain = o.gain ?? (right ? POINTS + (state.streak>0 ? sb(state.streak) : 0) : Math.round(POINTS*ratio*.5));
  state.score += gain;
  if(right){ state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak); confetti(30); vibrate(30); if(state.streak>=5) award('fire'); }
  else { state.streak = 0; if(ratio===0) state.lives--; vibrate([60,40,60]); }
  state.log.push({q:Q.q,right,answer:o.answer||''});
  fb.replaceChildren(
    el('div',{class:'feedback '+(right?'ok':'no'),text:`${o.detail?o.detail+' • ':''}+${gain} очок. `+(right?Q.ok:Q.no)}),
    el('button',{class:'btn',style:'margin-top:14px',text: state.lives<=0 ? '💔 Серця закінчились…' : 'Далі ➡️',onclick: state.lives<=0 ? reviveScreen : afterQuestion}));
}
const norm = s => String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function lev(a,b){ const d=Array.from({length:a.length+1},(_, i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }

/* --- 📅 розклади по порядку: Q.items у ПРАВИЛЬНОМУ порядку --- */
function orderScreen(Q){
  state.answered=false;
  let list = shuffle(Q.items);
  if(list.join()===Q.items.join()) list.reverse();
  const box = el('div'), fb = el('div'), check = el('button',{class:'btn',text:'Перевірити ✅'});
  const draw = () => box.replaceChildren(...list.map((t,i)=>el('div',{class:'oitem'},
    el('span',{class:'onum',text:i+1}), el('span',{class:'otxt',text:t}),
    el('button',{class:'ob',text:'▲','aria-label':'вгору',disabled:state.answered||i===0?'':null,onclick:()=>mv(i,-1)}),
    el('button',{class:'ob',text:'▼','aria-label':'вниз',disabled:state.answered||i===list.length-1?'':null,onclick:()=>mv(i,1)}))));
  const mv=(i,d)=>{ if(state.answered) return; [list[i],list[i+d]]=[list[i+d],list[i]]; draw(); vibrate(8); };
  draw();
  check.addEventListener('click',()=>{
    if(state.answered) return; check.remove();
    const hits=list.filter((t,i)=>t===Q.items[i]).length;
    state.answered=true; draw();
    [...box.children].forEach((r,i)=>r.classList.add(list[i]===Q.items[i]?'ok':'no'));
    resolve(Q,hits/list.length,fb,{answer:Q.items.join(' → '),detail:`На місці: ${hits}/${list.length}. Правильно: ${Q.items.join(' → ')}`});
  });
  shell(Q, el('p',{class:'center',style:'font-size:.9rem',text:Q.hint||'Стрілками ▲▼ розстав події від найпершої до найпізнішої'}), box, check, fb);
}

/* --- 👉👈 правда/міф: Q.cards = [{t:"…", a:true|false}] --- */
function swipeScreen(Q){
  state.answered=false; let k=0, good=0;
  const stage=el('div',{class:'sstage'}), cnt=el('p',{class:'center timer'}), fb=el('div');
  const btns=el('div',{class:'row2'},
    el('button',{class:'btn ghost',style:'margin:0',text:'❌ Міф',onclick:()=>decide(false)}),
    el('button',{class:'btn',text:'✅ Правда',onclick:()=>decide(true)}));
  let card;
  const show=()=>{
    if(k>=Q.cards.length){ btns.remove(); cnt.textContent='';
      stage.replaceChildren(el('div',{class:'scard',style:'position:static;transform:none'},`Відгадано ${good} з ${Q.cards.length}`));
      return resolve(Q,good/Q.cards.length,fb,{answer:Q.cards.map(c=>`${c.t} — ${c.a?'правда':'міф'}`).join('; '),detail:`${good}/${Q.cards.length}`}); }
    cnt.textContent=`Картка ${k+1}/${Q.cards.length}`;
    card=el('div',{class:'scard',text:Q.cards[k].t}); stage.replaceChildren(card);
    let x0=null,dx=0;
    card.addEventListener('pointerdown',e=>{x0=e.clientX;card.setPointerCapture(e.pointerId);});
    card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;});
    card.addEventListener('pointerup',()=>{ if(x0===null)return; x0=null; if(Math.abs(dx)>80) decide(dx>0); else {card.style.transform='';} dx=0; });
  };
  const decide=v=>{
    if(state.answered||k>=Q.cards.length) return;
    const ok=Q.cards[k].a===v; if(ok) good++; vibrate(ok?15:[30,20,30]);
    card.classList.add(v?'fly-r':'fly-l',ok?'cok':'cno'); k++; setTimeout(show,260);
  };
  shell(Q, el('p',{class:'center',style:'font-size:.9rem',text:'Свайпай картку праворуч (правда) або ліворуч (міф), або тисни кнопки'}), cnt, stage, btns, fb);
  show();
}

/* --- ⌨️ ввести відповідь: Q.accept = ["варіант1","варіант2"] --- */
function textScreen(Q){
  state.answered=false;
  const inp=el('input',{type:'text',placeholder:Q.placeholder||'Твоя відповідь…',autocomplete:'off'}), fb=el('div');
  const btn=el('button',{class:'btn',text:'Відповісти ✅'});
  const go=()=>{
    if(state.answered||!inp.value.trim()) return; btn.remove(); inp.disabled=true;
    const v=norm(inp.value);
    /* зараховуємо будь-який регістр, зайві слова («у Буковелі»), відмінки й одну опечатку */
    const ok=Q.accept.some(a=>{ const n=norm(a), near=t=>t===n||(n.length>4&&lev(t,n)<=1);
      return near(v) || v.split(' ').some(near); });
    resolve(Q, ok?1:0, fb, {answer:Q.accept[0],detail:ok?'':`Правильно: ${Q.accept[0]}`});
  };
  btn.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  shell(Q, inp, btn, fb);
}

/* --- 🙋 хто з нас: Q.answer = "me" | "you" --- */
function whoScreen(Q){
  state.answered=false; const fb=el('div');
  const mk=(id,label)=>el('button',{class:'who',text:label,onclick:()=>{
    if(state.answered) return; row.querySelectorAll('button').forEach(b=>b.disabled=true);
    const ok=id===Q.answer; row.querySelector(`[data-id=${Q.answer}]`).classList.add('correct');
    resolve(Q,ok?1:0,fb,{answer:Q.answer==='me'?'Я':'Ти'});
  },'data-id':id});
  const row=el('div',{class:'row2'},mk('me','🙋‍♂️ Я'),mk('you','🙋‍♀️ Ти'));
  shell(Q,row,fb);
}

/* --- 📝 заповни пропуски: Q.text з {0},{1}; Q.blanks=[{options:[…],answer:"…"}] --- */
function fillScreen(Q){
  state.answered=false; const fb=el('div'), sels=[];
  const para=el('p',{class:'fill'});
  Q.text.split(/(\{\d+\})/).forEach(part=>{
    const m=part.match(/^\{(\d+)\}$/);
    if(!m) return para.append(part);
    const b=Q.blanks[+m[1]];
    const s=el('select',{},el('option',{value:'',text:'— обери —'}),...shuffle(b.options).map(o=>el('option',{value:o,text:o})));
    sels[+m[1]]=s; para.append(s);
  });
  const btn=el('button',{class:'btn',text:'Перевірити ✅'});
  btn.addEventListener('click',()=>{
    if(sels.some(s=>!s.value)||state.answered) return; btn.remove();
    let hits=0; sels.forEach((s,i)=>{ s.disabled=true; const ok=s.value===Q.blanks[i].answer; if(ok) hits++; s.classList.add(ok?'ok':'no'); });
    resolve(Q,hits/sels.length,fb,{answer:Q.blanks.map(b=>b.answer).join(', '),detail:`${hits}/${sels.length}`+(hits<sels.length?` • Правильно: ${Q.blanks.map(b=>b.answer).join(', ')}`:'')});
  });
  shell(Q,para,btn,fb);
}

/* --- 📍 карта: Q.image (необов'язково), Q.target={x,y} у %, Q.radius у % --- */
function mapScreen(Q){
  state.answered=false; const fb=el('div'); let pt=null;
  const map=el('div',{class:'map'+(Q.image?' img':'')});
  if(Q.image) map.style.backgroundImage=`url(${Q.image})`;
  else (Q.landmarks||[['🏠',15,20],['🌳',70,25],['⛲',45,55],['🏪',20,75],['🎡',80,70]]).forEach(([e,x,y])=>{
    const l=el('span',{class:'lm',text:e}); l.style.left=x+'%'; l.style.top=y+'%'; map.append(l); });
  const pin=el('span',{class:'pin',text:'📍'});
  map.addEventListener('click',e=>{
    if(state.answered) return; const r=map.getBoundingClientRect();
    pt={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};
    pin.style.left=pt.x+'%'; pin.style.top=pt.y+'%'; map.append(pin); btn.disabled=false; vibrate(10);
  });
  const btn=el('button',{class:'btn',text:'Підтвердити 📍',disabled:''});
  btn.addEventListener('click',()=>{
    if(!pt||state.answered) return; btn.remove();
    const rad=Q.radius||12, d=Math.hypot(pt.x-Q.target.x,pt.y-Q.target.y);
    const ratio=d<=rad?1:d<=rad*2?.5:0;
    const z=el('span',{class:'tzone'}); z.style.cssText=`left:${Q.target.x}%;top:${Q.target.y}%;width:${rad*2}%;aspect-ratio:1`; 
    const h=el('span',{class:'lm',text:'❤️'}); h.style.left=Q.target.x+'%'; h.style.top=Q.target.y+'%';
    map.append(z,h);
    resolve(Q,ratio,fb,{answer:Q.answerText||'на карті',detail:ratio===1?'У яблучко!':ratio?'Майже, зовсім близько!':'Далеко…'});
  });
  shell(Q,el('p',{class:'center',style:'font-size:.9rem',text:'Тапни на карті там, де це було'}),map,btn,fb);
}

/* --- 🖼️ піксельне фото: Q.image (або Q.emoji), Q.options (перший — правильний) --- */
function pixelScreen(Q){
  state.answered=false;
  shell(Q,el('p',{class:'center',text:'Фото буде поступово проявлятися. Чим раніше вгадаєш, тим більше очок. Готова?'}),
    el('button',{class:'btn',text:'Готова! ▶️',onclick:()=>pixelPlay(Q)}));
}
function pixelPlay(Q){
  state.answered=false; const fb=el('div');
  const cv=el('canvas',{class:'pcv',width:'300',height:'300'}), ctx=cv.getContext('2d');
  const src=document.createElement('canvas'); src.width=src.height=300; const sx=src.getContext('2d');
  const STEPS=[6,9,14,22,40,90,300]; let st=0;
  const drawSrc=img=>{ sx.fillStyle='#fff0f6'; sx.fillRect(0,0,300,300);
    if(img){ const sc=Math.max(300/img.naturalWidth,300/img.naturalHeight), dw=img.naturalWidth*sc, dh=img.naturalHeight*sc; sx.drawImage(img,(300-dw)/2,(300-dh)/2,dw,dh); } else { sx.font='200px serif'; sx.textAlign='center'; sx.textBaseline='middle'; sx.fillText(Q.emoji,150,165); } paint(); };
  const paint=()=>{ const s=STEPS[st], off=document.createElement('canvas'); off.width=off.height=s;
    off.getContext('2d').drawImage(src,0,0,s,s); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,300,300); ctx.drawImage(off,0,0,300,300); };
  if(Q.image){ const im=new Image(); im.onload=()=>drawSrc(im); im.onerror=()=>drawSrc(null); im.src=Q.image; } else drawSrc(null);
  const id=setInterval(()=>{ if(st<STEPS.length-1){st++;paint();} else clearInterval(id); },1400); onCleanup(()=>clearInterval(id));
  const correct=Q.options[0];
  const btns=shuffle(Q.options).map(o=>{const b=el('button',{class:'opt',text:o});
    b.addEventListener('click',()=>{ if(state.answered) return; clearInterval(id); st=STEPS.length-1; paint();
      btns.forEach(x=>{x.disabled=true; if(x.textContent===correct) x.classList.add('correct');});
      const ok=o===correct; if(!ok) b.classList.add('wrong');
      const early=1-(Math.min(st0,STEPS.length-1)/(STEPS.length-1))*.5;
      resolve(Q,ok?1:0,fb,{gain: ok ? Math.round(POINTS*early)+(state.streak>0?sb(state.streak):0) : 0, answer:correct, detail: ok?`Вгадала на кроці ${st0+1}/${STEPS.length}`:''}); });
    return b;});
  let st0=0; const track=setInterval(()=>{st0=st;},100); onCleanup(()=>clearInterval(track));
  shell(Q,el('p',{class:'center',style:'font-size:.9rem',text:'Фото поступово проявляється. Чим раніше вгадаєш, тим більше очок!'}),cv,...btns,fb);
}

const TYPES={slider:sliderScreen,order:orderScreen,swipe:swipeScreen,text:textScreen,who:whoScreen,fill:fillScreen,map:mapScreen,pixel:pixelScreen};

/* --- 🔍 знайди відмінності ---
   Q.image — фото; Q.imageB — друге фото (необов'язково: якщо немає, друге фото створюється з першого
   за списком Q.diffs). diffs: [{x,y,r}] у % ширини фото (+ fx для автоген.: tint|dark|emoji|clone). */
function diffScreen(Q){
  state.answered=false; const fb=el('div'), N=Q.diffs.length, found=new Set(); let miss=0, ready=false, W=1, H=1, over=false;
  const MAXMISS=Q.maxMiss||5, info=el('p',{class:'timer'});
  const cA=el('canvas',{class:'dcv'}), cB=el('canvas',{class:'dcv'});
  const wA=el('div',{class:'dwrap'},cA), wB=el('div',{class:'dwrap'},cB);
  const upd=()=>{ info.textContent=`Знайдено ${found.size}/${N} • помилки ${'❌'.repeat(miss)}${'▫️'.repeat(Math.max(0,MAXMISS-miss))}`; }; upd();
  function fx(c,img,d){ const cx=d.x/100*W, cy=d.y/100*H, r=d.r/100*W;
    c.save(); c.beginPath(); c.ellipse(cx,cy,r,r,0,0,7);
    if(d.fx==='tint'){ c.clip(); c.globalCompositeOperation='color'; c.fillStyle=d.color||'#ff3d9a'; c.fillRect(cx-r,cy-r,2*r,2*r); }
    else if(d.fx==='dark'){ c.clip(); c.fillStyle='rgba(0,0,0,.5)'; c.fillRect(cx-r,cy-r,2*r,2*r); }
    else if(d.fx==='clone'){ c.clip(); const sx=d.from[0]/100*W, sy=d.from[1]/100*H; c.drawImage(img,sx-r,sy-r,2*r,2*r,cx-r,cy-r,2*r,2*r); }
    else if(d.fx==='emoji'){ c.restore(); c.save(); c.font=`${r*2}px serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(d.e,cx,cy); }
    c.restore(); }
  const img=new Image();
  img.onload=()=>{ W=img.naturalWidth; H=img.naturalHeight; cA.width=cB.width=W; cA.height=cB.height=H;
    cA.getContext('2d').drawImage(img,0,0);
    const cb=cB.getContext('2d');
    if(Q.imageB){ const i2=new Image(); i2.onload=()=>{ cb.drawImage(i2,0,0,W,H); ready=true; }; i2.src=Q.imageB; }
    else { cb.drawImage(img,0,0); Q.diffs.forEach(d=>fx(cb,img,d)); ready=true; } };
  img.src=Q.image;
  const mark=(d,cls)=>{ for(const w of [wA,wB]){ const m=el('div',{class:'dmark'+(cls?' '+cls:'')}); m.style.left=d.x+'%'; m.style.top=(d.y/100*H/W*100*(W/H))+'%'; m.style.width=(Math.max(d.r*2.4,9))+'%'; w.append(m); } };
  const flash=(w,e)=>{ const r=w.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100; const m=el('div',{class:'dmiss',text:'❌'}); m.style.left=x+'%'; m.style.top=y+'%'; w.append(m); setTimeout(()=>m.remove(),700); };

/* --- ☑️ вибір кількох відповідей: Q.items=[{t:"…", a:true|false}] --- */
function multiScreen(Q){
  state.answered=false; const fb=el('div'), items=shuffle(Q.items), sel=new Set();

    b.addEventListener('click',()=>{ if(state.answered) return; if(sel.has(i)){ sel.delete(i); b.classList.remove('sel'); b.firstChild.textContent='☐'; } else { sel.add(i); b.classList.add('sel'); b.firstChild.textContent='☑'; } vibrate(8); });
    return b; });
  const check=el('button',{class:'btn',text:'Перевірити ✅'});

    if(state.answered) return; check.remove();

    items.forEach((it,i)=>{ const b=btns[i], on=sel.has(i); b.disabled=true;

  });

/* --- 🔦 прожектор: фото закрите темрявою, відкривається пальцем ---
   Q.image — фото; Q.options — варіанти (перший правильний); чим менше відкрито, тим більше очок */
function spotScreen(Q){
  state.answered=false; const fb=el('div'); let W=1,H=1,ready=false,moves=0,rev=0;
  const base=el('canvas',{class:'dcv'}), dark=el('canvas',{class:'spotdark'});
  const wrap=el('div',{class:'dwrap spotwrap'},base,dark);
  const info=el('p',{class:'timer',text:'🔦 Води пальцем по фото'});
  const img=new Image();
  img.onload=()=>{ W=img.naturalWidth; H=img.naturalHeight; base.width=dark.width=W; base.height=dark.height=H;
    base.getContext('2d').drawImage(img,0,0);
    const d=dark.getContext('2d'); d.fillStyle='#1d0f1f'; d.fillRect(0,0,W,H);
    d.fillStyle='#ffffff55'; d.font=`700 ${W*0.05}px Fredoka,sans-serif`; d.textAlign='center'; d.fillText('води пальцем 👆',W/2,H/2); ready=true; };
  img.src=Q.image;
  function reveal(e){
    if(!ready||state.answered) return; const r=wrap.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H, R=W*0.11;
    const d=dark.getContext('2d'); d.globalCompositeOperation='destination-out';
    const g=d.createRadialGradient(x,y,R*.35,x,y,R); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); d.fillStyle=g; d.beginPath(); d.arc(x,y,R,0,7); d.fill();
    if(++moves%6===0) measure(); }
  function measure(){ const d=dark.getContext('2d'), data=d.getImageData(0,0,W,H).data; let t=0,c=0, step=Math.max(8,Math.floor(W/60))*4;
    for(let yy=0;yy<H;yy+=step/4*1) for(let xx=0;xx<W;xx+=step/4){ t++; if(data[(yy*W+xx)*4+3]<60) c++; } rev=c/t; info.textContent=`🔦 Відкрито: ${Math.round(rev*100)}%`; }
  let down=false;
  wrap.addEventListener('pointerdown',e=>{ e.preventDefault(); down=true; wrap.setPointerCapture(e.pointerId); reveal(e); });
  wrap.addEventListener('pointermove',e=>{ if(down) reveal(e); });
  wrap.addEventListener('pointerup',()=>{ down=false; measure(); });
  const correct=Q.options[0];
  const btns=shuffle(Q.options).map(o=>{ const b=el('button',{class:'opt',text:o});
    b.addEventListener('click',()=>{ if(state.answered) return; measure();
      btns.forEach(x=>{x.disabled=true; if(x.textContent===correct) x.classList.add('correct');});
      const ok=o===correct; if(!ok) b.classList.add('wrong'); dark.classList.add('gone');
      resolve(Q,ok?1:0,fb,{gain: ok ? Math.round(POINTS*(1-.4*Math.min(1,rev)))+(state.streak>0?sb(state.streak):0) : 0, answer:correct, detail: ok?`Відкрито ${Math.round(rev*100)}% фото`:''}); });
    return b; });
  shell(Q, el('p',{class:'center',style:'font-size:.9rem',text:'Фото закрите темрявою. Води пальцем (чи мишкою), щоб відкривати ділянки. Чим менше відкриєш, тим більше очок!'}), info, wrap, ...btns, fb);
}

/* --- 🎡 колесо фортуни (міні-гра). WHEEL — призи/завдання, редагуй --- */

/* --- 🎰 подряпай-картка для фінального подарунка --- */
function scratchify(box,onDone){
  const w=box.offsetWidth,h=box.offsetHeight, cv=el('canvas',{class:'scratch',width:w,height:h}), c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,w,h); g.addColorStop(0,'#ff9ec7'); g.addColorStop(.5,'#ffd6e8'); g.addColorStop(1,'#ff74ad');
  c.fillStyle=g; c.fillRect(0,0,w,h); c.fillStyle='#fff'; c.font='600 22px Fredoka,sans-serif'; c.textAlign='center'; c.fillText('✨ ПОДРЯПАЙ ПАЛЬЦЕМ ✨',w/2,h/2);
  c.globalCompositeOperation='destination-out'; let down=false,mv=0,done=false;
  const sc=e=>{ const r=cv.getBoundingClientRect(); c.beginPath(); c.arc(e.clientX-r.left,e.clientY-r.top,22,0,7); c.fill(); if(++mv%8===0) chk(); };
  const chk=()=>{ const d=c.getImageData(0,0,w,h).data; let z=0,t=0; for(let i=3;i<d.length;i+=64){t++; if(d[i]<20) z++;} if(!done&&z/t>.5){done=true;cv.classList.add('gone');setTimeout(()=>cv.remove(),600);onDone();} };
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);sc(e);});
  cv.addEventListener('pointermove',e=>{if(down)sc(e);}); cv.addEventListener('pointerup',()=>down=false);
  box.append(cv);
}

/* =====================================================================
   🕹️ ВЕЛИКІ МІНІ-ІГРИ (у стилі 1-2-Switch): курка, суші-вежа, лапки проти комп'ютера
   ===================================================================== */
function mkCanvas(W,H){
  const dpr=Math.min(2,window.devicePixelRatio||1), cv=el('canvas',{class:'gcv'});
  cv.width=W*dpr; cv.height=H*dpr; cv.style.aspectRatio=W+'/'+H;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return [cv,ctx];
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function raf(fn){ let last=performance.now(), id, on=true;
  const f=t=>{ if(!on) return; const dt=Math.min(.05,(t-last)/1000); last=t; fn(dt); if(on) id=requestAnimationFrame(f); };
  id=requestAnimationFrame(f); const stop=()=>{on=false;cancelAnimationFrame(id);}; onCleanup(stop); return stop; }
function tap(target,fn){
  target.addEventListener('pointerdown',e=>{e.preventDefault();fn();});
  const key=e=>{ if(e.code==='Space'){e.preventDefault(); if(!e.repeat) fn();} };
  document.addEventListener('keydown',key); onCleanup(()=>document.removeEventListener('keydown',key));
}
function later(fn,ms){ const t=setTimeout(fn,ms); onCleanup(()=>clearTimeout(t)); return t; }

/* =====================================================================
   🕹️ ВЕЛИКІ МІНІ-ІГРИ (повноекранні, горизонтальні, у стилі 1-2-Switch):
   курка, суші-вежа, лапки проти комп'ютера. Малюються на canvas 2000×923.

const SW=2000, SH=923;
function openStage(onTap,onSkip){
  const ov=el('div',{class:'stage-ov'}), stg=el('div',{class:'stg'}), cv=el('canvas',{width:SW,height:SH});
  const home=el('button',{class:'stg-home',text:'⌂','aria-label':'Пропустити'});
  home.addEventListener('pointerdown',e=>e.stopPropagation());
  home.addEventListener('click',e=>{e.stopPropagation();onSkip&&onSkip();});
  stg.append(cv,home); ov.append(stg); document.body.append(ov);
  const fit=()=>{ const vw=innerWidth,vh=innerHeight,port=vh>vw;
    const s=port?Math.min(vh/SW,vw/SH):Math.min(vw/SW,vh/SH);
    stg.style.transform=`translate(-50%,-50%) ${port?'rotate(90deg) ':''}scale(${s})`; };
  fit(); window.addEventListener('resize',fit); rotateHint();
  const close=()=>{ window.removeEventListener('resize',fit); ov.remove(); };
  onCleanup(close); tap(stg,onTap);
  return {c:cv.getContext('2d'),close};
}
const CORN=[
  {sx:1,sy:1,big:'#f2cb2c',ray:'#ffe56e',btn:'#ffd52e',ink:'#cda62c',hand:'#ead58c'},
  {sx:-1,sy:1,big:'#1f66e0',ray:'#4c8dff',btn:'#5b9fff',ink:'#2358cc',hand:'#a9c8ff'},
  {sx:1,sy:-1,big:'#e5210e',ray:'#ff5a40',btn:'#f22b0f',ink:'#b01a0a',hand:'#e89a95'},
  {sx:-1,sy:-1,big:'#5fd04a',ray:'#8cf06a',btn:'#7dd23a',ink:'#4a9f33',hand:'#cdeab5'}];
function drawCorners(c,press){
  CORN.forEach((k,i)=>{ c.save(); c.translate(k.sx>0?0:SW,k.sy>0?0:SH); c.scale(k.sx,k.sy);
    c.beginPath(); c.ellipse(0,0,235,190,0,0,7); c.fillStyle=k.big; c.fill();
    c.save(); c.clip(); c.fillStyle=k.ray; for(let a=0;a<90;a+=12){ c.beginPath(); c.moveTo(0,0); c.arc(0,0,270,a*Math.PI/180,(a+6)*Math.PI/180); c.fill(); } c.restore();
    const sc=(i===2&&press>0)?1-.08*press:1; c.translate(155,127); c.scale(sc,sc);
    c.beginPath(); c.ellipse(0,0,100,83,0,0,7); c.fillStyle='#fffffff0'; c.fill();
    c.beginPath(); c.ellipse(0,0,91,74,0,0,7); c.fillStyle=k.btn; c.fill();
    c.beginPath(); c.arc(0,0,48,0,7); c.fillStyle=k.ink; c.fill();

function stageText(c,t,x,y,size,fill,stroke){ c.font=`700 ${size}px Fredoka,sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.lineJoin='round';

/* ---------- 1) 🐔 Курка проти гравітації ---------- */
function gameChicken(done){
  const BANDS=[41,205,369,533,697,861], BT=41, CW=76, CH=72, CXS=920, LEN=6200;
  const gaps=[], obs=[], OW=50, OH=44;
  for(let j=1;j<=4;j++){ let x=1200+Math.random()*500; while(x<LEN){ gaps.push({j,x,w:210}); x+=800+Math.random()*700; } }
  const solid=(j,wx)=> j===0||j===5 || !gaps.some(g=>g.j===j&&wx>g.x+6&&wx<g.x+g.w-6);
  /* бомби: лежать на платформі (top) або висять під нею (bottom). Їх БАГАТО: на кожній смузі проходу
     (між двома платформами) тримаємо відстані, щоб завжди можна було перевернутись і пролетіти */
  const laneB=[[],[],[],[],[]], SAME=210, OPP=300;
  for(let x=1500;x<LEN-450;x+=55+Math.random()*70){
    const j=Math.floor(Math.random()*6), side=j===0?'bottom':j===5?'top':(Math.random()<.5?'top':'bottom');
    const bx=x+Math.random()*40, lane=side==='top'?j-1:j;
    if(!(solid(j,bx)&&solid(j,bx+OW))) continue;
    if(laneB[lane].some(o=>Math.abs(o.x-bx)<(o.side===side?SAME:OPP))) continue;
    laneB[lane].push({x:bx,side}); obs.push({j,x:bx,side});
  }
  let cam=0,y=BANDS[2]-CH,vy=0,g=1,hits=0,inv=0,over=false,t=0,press=0,restarts=0,boom=0,note='',noteT=0;
  const flip=()=>{ if(over) return; g=-g; vy=g*260; press=1; vibrate(8); };
  let ended=false; const fin=(pts,msg)=>{ if(ended) return; ended=true; over=true; stop(); later(()=>{ st.close(); done(pts,msg); },pts?500:0); };
  const st=openStage(flip,()=>fin(0,'Гру пропущено'));
  const c=st.c;
  const tile=(x,yy,w,i)=>{ c.fillStyle=(i%2)?'#2d7cc8':'#3d2153'; c.fillRect(x,yy,w,BT); };
  const stop=raf(dt=>{
    t+=dt; press=Math.max(0,press-dt*6); boom=Math.max(0,boom-dt); noteT=Math.max(0,noteT-dt);
    if(!over){
      cam+=(340+Math.min(120,cam/60))*dt; const wx=cam+CXS; inv=Math.max(0,inv-dt);
      vy+=4400*g*dt; const py=y, ny=y+vy*dt;
      let ny2=ny;
      if(g>0){ for(const yt of BANDS){ const j=BANDS.indexOf(yt); if(py+CH<=yt+2&&ny+CH>=yt&&solid(j,wx)){ ny2=yt-CH; vy=0; break; } } }
      else { for(const yt of BANDS){ const j=BANDS.indexOf(yt), yb=yt+BT; if(py>=yb-2&&ny<=yb&&solid(j,wx)){ ny2=yb; vy=0; break; } } }
      y=ny2;
      if(inv<=0) for(const o of obs){ const oy=o.side==='top'?BANDS[o.j]-OH:BANDS[o.j]+BT;
        if(wx+CW/2-12>o.x && wx-CW/2+12<o.x+OW && y+CH-8>oy && y+8<oy+OH){ hits++; inv=1.4; boom=.45; vibrate([50,30,50]); break; } }
      if(hits>=3){ restarts++; hits=0; cam=0; y=BANDS[2]-CH; vy=0; g=1; inv=2; noteT=1.6; note='💥 Життя закінчились! Біжимо з початку'; vibrate([80,40,80]); }
      else if(wx>=LEN) fin(Math.max(40,150-restarts*30),restarts?`Курка дісталась фінішу з ${restarts+1}-ї спроби! 🐔🏁`:'Курка добігла з першої спроби! 🏆');
    }
    /* sky */
    c.fillStyle='#ff80c1'; c.fillRect(0,0,SW,SH);
    c.fillStyle='#f5f9ff';
    const cl=[[300,470,150],[470,430,110],[640,500,160],[1330,480,120],[1520,520,170],[1800,470,110],[1050,560,200]];
    for(const [cx,cy,r] of cl){ const px=((cx-cam*.22)%2400+2400)%2400-200; c.beginPath(); c.arc(px,cy+r*.4,r,0,7); c.fill(); c.beginPath(); c.arc(px+SW*1.2,cy+r*.4,r,0,7); c.fill(); }
    c.fillRect(0,570,SW,SH-570);
    /* bands */
    BANDS.forEach((by,j)=>{ const x0=-(cam%100);
      for(let x=x0-100;x<SW;x+=50){ const wxs=x+cam; if(!solid(j,wxs+25)) continue; tile(x,by,50,Math.round(wxs/50)); } });
    /* бомби */
    for(const o of obs){ const sx=o.x-cam; if(sx<-100||sx>SW+60) continue; const oy=o.side==='top'?BANDS[o.j]-OH:BANDS[o.j]+BT;
      c.save(); c.translate(sx+OW/2,oy+OH/2); if(o.side==='bottom') c.scale(1,-1);
      c.fillStyle='#24242e'; c.strokeStyle='#0e0e14'; c.lineWidth=4; c.beginPath(); c.ellipse(0,2,OW/2-1,OH/2-1,0,0,7); c.fill(); c.stroke();
      c.fillStyle='#ffffff55'; c.beginPath(); c.ellipse(-10,-4,8,5,-.5,0,7); c.fill();
      c.fillStyle='#55555f'; rr(c,-8,-OH/2-6,16,10,3); c.fill();
      c.strokeStyle='#8a5a2b'; c.lineWidth=4; c.lineCap='round'; c.beginPath(); c.moveTo(0,-OH/2-4); c.quadraticCurveTo(10,-OH/2-16,18,-OH/2-12); c.stroke();
      const sp=6+Math.sin(t*20+o.x)*3; c.fillStyle='#ffb21c'; c.beginPath(); for(let a=0;a<8;a++){ const r=a%2?sp*.5:sp; c.lineTo(20+r*Math.cos(a*Math.PI/4),-OH/2-13+r*Math.sin(a*Math.PI/4)); } c.closePath(); c.fill();
      c.restore(); }
    /* finish */
    const fx=LEN-cam+CXS; if(fx<SW+80){ for(let r=0;r<18;r++){ for(let k=0;k<2;k++){ c.fillStyle=((r+k)%2)?'#222':'#fff'; c.fillRect(fx+k*30,r*52,30,52); } } }
    /* chicken */
    if(!(inv>0&&Math.floor(t*14)%2)) drawChicken(c,CXS,y+CH/2,g,press);
    /* hud */

};
function gameFindCat(done){
  const C=FINDCAT, found=new Set(); let over=false, ready=false, W=1, H=1, left=C.time, miss=0;
  const cv=el('canvas',{class:'dcv fcv'}), wrap=el('div',{class:'dwrap fwrap'},cv);
  const info=el('p',{class:'timer'}), upd=()=>{ info.textContent=`🐱 ${found.size}/${C.cats.length} • ⏱ ${left} • промахи: ${miss}`; }; upd();
  const photo=new Image(), imgs=C.cats.map(c=>{ const i=new Image(); i.src=c.src; return i; });
  let loaded=0; const onl=()=>{ if(++loaded===C.cats.length+1){ W=photo.naturalWidth; H=photo.naturalHeight; cv.width=W; cv.height=H; ready=true; draw(); } };
  photo.onload=onl; imgs.forEach(i=>i.onload=onl); photo.src=C.image;
  function draw(){
    const c=cv.getContext('2d'); c.clearRect(0,0,W,H); c.drawImage(photo,0,0,W,H);
    C.cats.forEach((k,i)=>{ const im=imgs[i], w=W*k.s/100, h=w*im.naturalHeight/im.naturalWidth, x=W*k.x/100-w/2, y=H*k.y/100-h/2;
      c.save();
      if(found.has(i)){ c.globalAlpha=1; c.drawImage(im,x-w*.1,y-h*.1,w*1.2,h*1.2); }
      else { c.beginPath(); c.rect(x-2,y-2,w+4,h*k.show+2); c.clip(); c.globalCompositeOperation='multiply'; c.globalAlpha=.9; c.drawImage(im,x,y,w,h); }
      c.restore(); });
  }
  function ring(k,cls){ const m=el('div',{class:'dmark'+(cls?' '+cls:'')}); m.style.left=k.x+'%'; m.style.top=k.y+'%'; m.style.width=(Math.max(k.s*1.8,11))+'%'; wrap.append(m); return m; }
  wrap.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(over||!ready) return; const r=wrap.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*100, py=(e.clientY-r.top)/r.height*100;
    const hit=C.cats.findIndex((k,i)=>!found.has(i)&&Math.hypot(px-k.x,(py-k.y)*(H/W))<=Math.max(k.s*.75,6));
    if(hit>=0){ found.add(hit); ring(C.cats[hit]); draw(); vibrate(25); upd(); if(found.size===C.cats.length) end(); }
    else { miss++; vibrate([30,20,30]); const m=el('div',{class:'dmiss',text:'❌'}); m.style.left=px+'%'; m.style.top=py+'%'; wrap.append(m); setTimeout(()=>m.remove(),600); upd(); }
  });
  const stop=countdown(C.time,t=>{ left=t; upd(); },()=>end());
  function end(){ if(over) return; over=true; C.cats.forEach((k,i)=>{ if(!found.has(i)) ring(k,'rev'); });
    const n=found.size, pts=Math.max(0,Math.min(150,n*30-Math.floor(miss/3)*5));
    later(()=>done(pts, n===C.cats.length?'Усі коти знайдені! 🐱':n>0?`Знайдено ${n} з ${C.cats.length} котів.`:'Жодного кота не знайдено.', 'photos/cat/cat'+(Math.min(5,Math.max(1,n))) +'.png'),1200); }
  const hintBtn=el('button',{class:'hint',text:`💡 Підказка (${state.hints})`});
  if(!state.hints) hintBtn.disabled=true;
  hintBtn.addEventListener('click',()=>{ if(over||!state.hints) return; const i=C.cats.findIndex((_,k)=>!found.has(k)); if(i<0) return;
    state.hints--; hintBtn.textContent=`💡 Підказка (${state.hints})`; if(!state.hints) hintBtn.disabled=true;
    const m=ring(C.cats[i],'hint'); setTimeout(()=>m.remove(),1800); });
  playCard('Знайди котів!', el('p',{text:`На фото непомітно сховались ${C.cats.length} котів. Знайди їх усіх за ${C.time} секунд, тапай по кожному.`}), el('div',{class:'game-box'},info,wrap), hintBtn);
}
gameFindCat.intro=go=>introCard('🔎','Знайди котів','На фото сховались п\'ять котів, дуже непомітно: за колодами, камінням, у траві. Знайди всіх за хвилину!',go);

startScreen();
</script>
